name: tcs_app
description: "TCS - Taylors College Social Media & Arcade Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.1.1
  get: ^4.7.3
  
  # Networking
  http: ^1.6.0
  dio: ^5.4.0
  
  # Storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.0.0
  
  # Authentication & JWT
  jwt_decoder: ^2.0.1
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_storage: ^11.6.0
  firebase_auth: ^4.16.0
  
  # Supabase
  supabase_flutter: ^2.0.0
  
  # Image & Media
  image_picker: ^1.0.7
  cached_network_image: ^3.4.1
  
  # QR Code
  qr_flutter: ^4.1.0
  
  # Game Engine
  flame: ^1.13.1
  
  # UI Components
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  lottie: ^3.0.0

  
  # Utilities
  intl: ^0.20.2
  timeago: ^3.6.0
  url_launcher: ^6.2.3
  animated_segmented_tab_control: ^2.0.0
  gradient_borders: ^1.0.2
  flutter_spinkit: ^5.2.2
  web_socket_channel: ^3.0.3
  http_parser: ^4.1.2
  permission_handler: ^12.0.1
  record: ^6.2.0
  just_audio: ^0.10.5
  video_player: ^2.11.1
  
  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/games/

  fonts:
    - family: Alfa
      fonts:
        - asset: assets/fonts/alfa.ttf
    - family: Arch
      fonts:
        - asset: assets/fonts/arch.ttf
    - family: Momo
      fonts:
        - asset: assets/fonts/momo.ttf