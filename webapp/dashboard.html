<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Student Hub · TCS</title>
<meta name="theme-color" content="#0D0D1A" />
<link rel="stylesheet" href="assets/onboarding.css" />
<script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.14/dist/dotlottie-wc.js" type="module"></script>
<style>
  /* ── Theme tokens (gradients --g1..g4 stay identical in both) ── */
  :root { --card: #14121F; --side: rgba(16,15,28,0.72); --modal-scrim: rgba(6,5,14,0.62); }
  :root[data-theme="light"] {
    --bg1: #EDEFF6; --bg2: #E7E3F5; --bg3: #F3E9EF;
    --ink: #1C1830;
    --sub: rgba(28,24,54,0.66); --faint: rgba(28,24,54,0.44);
    --glass: rgba(28,24,54,0.045); --glass-2: rgba(28,24,54,0.07);
    --hair: rgba(28,24,54,0.12); --hair-2: rgba(28,24,54,0.18);
    --card: #FFFFFF; --side: rgba(255,255,255,0.78); --modal-scrim: rgba(40,30,80,0.32);
  }
  /* Softer card shadow + solid cards in light mode */
  :root[data-theme="light"] .glass, :root[data-theme="light"] .card.glass { box-shadow: 0 10px 30px rgba(60,40,110,0.10); }
  /* The neon arcade is a self-contained dark screen — pin its tokens dark in any theme */
  .arc-neon { --ink: #F4F3FF; --sub: #AFC0D6; --faint: #7C8BA6; --glass: rgba(255,255,255,.05); --glass-2: rgba(255,255,255,.08); --hair: rgba(0,229,255,.14); --hair-2: rgba(0,229,255,.22); --card: #0d0919; }

  body { overflow: hidden; }
  .app { position: fixed; inset: 0; z-index: 3; display: flex; }

  /* ── Sidebar ─────────────────────────────────────────────────── */
  .side {
    width: 264px; flex: 0 0 auto; height: 100%;
    background: var(--side); border-right: 1px solid var(--hair);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    display: flex; flex-direction: column;
    padding: 20px 16px max(env(safe-area-inset-bottom), 16px);
  }
  .side-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 4px 6px; }
  .brand-title { font-family: 'Alfa', serif; font-size: 26px; line-height: 1;
    background: linear-gradient(90deg, var(--g1), var(--g2), var(--g3), var(--g4));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .brand-sub { font-family: 'Momo', sans-serif; font-size: 12px; color: var(--sub); margin-top: 4px; letter-spacing: 0.4px; }
  .notif-btn { position: relative; width: 40px; height: 40px; flex: 0 0 auto; border-radius: 13px; cursor: pointer;
    background: var(--glass-2); border: 1px solid var(--hair); color: var(--ink);
    display: grid; place-items: center; transition: background 0.15s ease, border-color 0.15s ease; }
  .notif-btn:hover { background: var(--glass-2); border-color: var(--hair-2); }
  .head-btns { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .notif-btn svg { width: 20px; height: 20px; fill: currentColor; }
  .notif-btn .dot { position: absolute; top: 7px; right: 8px; min-width: 16px; height: 16px; padding: 0 4px;
    border-radius: 8px; background: var(--g4); color: #fff; font-family: 'Arch', sans-serif; font-weight: 700;
    font-size: 9.5px; display: none; align-items: center; justify-content: center; border: 2px solid #14121f; }
  .notif-btn .dot.show { display: flex; }

  .grad-divider { height: 2px; margin: 16px 6px 14px; border-radius: 2px;
    background: linear-gradient(90deg, var(--g1), var(--g2), var(--g3), var(--g4)); opacity: 0.9; }

  .nav { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
  .nav-item { display: flex; align-items: center; gap: 13px; width: 100%; padding: 12px 14px; border: 0; cursor: pointer;
    background: none; border-radius: 14px; color: var(--sub); text-align: left;
    font-family: 'Arch', sans-serif; font-weight: 700; font-size: 14px; transition: background 0.15s ease, color 0.15s ease; }
  .nav-item svg { width: 21px; height: 21px; fill: currentColor; flex: 0 0 auto; }
  .nav-item:hover { background: var(--glass); color: var(--ink); }
  .nav-item.active { color: #fff; background: linear-gradient(90deg, rgba(142,84,233,0.28), rgba(109,213,250,0.12));
    box-shadow: inset 3px 0 0 var(--g1); }

  .side-bottom { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--hair); display: flex; flex-direction: column; gap: 4px; }
  .nav-item.arcade { color: #F5C36B; }
  .nav-item.arcade:hover { background: rgba(247,151,30,0.12); }
  .nav-item.logout { color: #FF8A9B; }
  .nav-item.logout:hover { background: rgba(228,68,90,0.12); }

  /* ── Content ─────────────────────────────────────────────────── */
  .content { flex: 1; height: 100%; overflow-y: auto; }
  .inner { max-width: none; margin: 0; padding: 30px 32px 60px; }
  .view-head { margin-bottom: 20px; }
  .view-head h1 { font-family: 'Alfa', serif; font-size: 27px; line-height: 1.1; }
  .view-head p { font-family: 'Momo', sans-serif; font-size: 13px; color: var(--sub); margin-top: 6px; }

  .card { padding: 16px; margin-bottom: 12px; }
  .row { display: flex; gap: 12px; }
  .av { width: 44px; height: 44px; border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--g2), var(--g1)); font-family: 'Alfa', serif; font-size: 15px; color: #fff; overflow: hidden; }
  .av img { width: 100%; height: 100%; object-fit: cover; }
  .muted { color: var(--sub); } .faint { color: var(--faint); }
  .chip { display: inline-block; font-family: 'Arch', sans-serif; font-weight: 700; font-size: 10.5px; letter-spacing: 0.4px;
    padding: 3px 9px; border-radius: 999px; text-transform: uppercase; }
  .pillbtn { border: 0; cursor: pointer; border-radius: 12px; padding: 8px 16px; color: #fff;
    font-family: 'Arch', sans-serif; font-weight: 700; font-size: 12.5px;
    background: linear-gradient(90deg, var(--g2), var(--g1)); }
  .pillbtn.ghost2 { background: var(--glass-2); border: 1px solid var(--hair); color: var(--ink); }

  .empty, .loading { text-align: center; padding: 50px 20px; font-family: 'Momo', sans-serif; color: var(--faint); font-size: 13.5px; }
  .spin { width: 26px; height: 26px; border: 3px solid rgba(255,255,255,0.18); border-top-color: var(--g1);
    border-radius: 50%; margin: 0 auto 12px; animation: rot 0.8s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }

  /* Notifications dropdown (mobile-style: Today / Yesterday / Earlier) */
  .notif-panel { position: fixed; top: 66px; left: 16px; width: 372px; max-width: calc(100vw - 32px); max-height: 74vh;
    z-index: 40; padding: 0; display: none; flex-direction: column; overflow: hidden; }
  .notif-panel.open { display: flex; }
  .notif-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 10px; }
  .notif-head h3 { font-family: 'Alfa', serif; font-size: 18px; color: var(--ink); }
  .notif-clear { background: none; border: 0; cursor: pointer; font-family: 'Arch', sans-serif; font-weight: 700; font-size: 11.5px; color: var(--g4); padding: 4px 6px; }
  .notif-clear:hover { text-decoration: underline; }
  .notif-tabs { display: flex; gap: 6px; padding: 0 14px 12px; border-bottom: 1px solid var(--hair); }
  .notif-tab { flex: 1; padding: 7px 0; border-radius: 999px; border: 1px solid var(--hair); background: var(--glass); cursor: pointer;
    font-family: 'Arch', sans-serif; font-weight: 700; font-size: 11.5px; color: var(--sub); }
  .notif-tab.active { background: linear-gradient(135deg, var(--g2), var(--g1)); color: #fff; border: 0; }
  #notifList { flex: 1; overflow-y: auto; padding: 8px; }
  .notif-item { display: flex; align-items: flex-start; gap: 11px; padding: 11px 10px; border-radius: 13px; cursor: pointer; }
  .notif-item:hover { background: var(--glass); }
  .notif-item.unread { background: rgba(142,84,233,0.10); }
  .notif-ic { width: 40px; height: 40px; flex: 0 0 auto; border-radius: 12px; display: grid; place-items: center; font-size: 19px; }
  .notif-item .notif-avc { width: 40px; height: 40px; flex: 0 0 auto; font-size: 15px; }
  .notif-body { flex: 1; min-width: 0; }
  .notif-item .t { font-family: 'Arch', sans-serif; font-weight: 700; font-size: 13px; color: var(--ink); line-height: 1.35; }
  .notif-item .b { font-family: 'Momo', sans-serif; font-size: 12px; color: var(--sub); margin-top: 3px; line-height: 1.45; }
  .notif-time { font-family: 'Momo', sans-serif; font-size: 10.5px; color: var(--faint); margin-top: 5px; }
  .notif-udot { width: 8px; height: 8px; flex: 0 0 auto; border-radius: 50%; margin-top: 6px; background: linear-gradient(135deg, var(--g2), var(--g1)); box-shadow: 0 0 8px rgba(142,84,233,.6); }
  .notif-empty { text-align: center; padding: 40px 20px; font-family: 'Momo', sans-serif; font-size: 13px; color: var(--faint); }

  .grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }

  /* Profile */
  .prof-hero { display: flex; align-items: center; gap: 18px; padding: 22px; }
  .prof-hero .big { width: 84px; height: 84px; font-size: 30px; border-radius: 26px; }
  .prof-hero .big.round { border-radius: 50%; }
  .prof-stats { display: grid; grid-template-columns: repeat(4,1fr); padding: 4px; margin: 12px 0; }
  .prof-stats .s { text-align: center; padding: 14px 4px; }
  .prof-stats .s + .s { border-left: 1px solid var(--hair); }
  .prof-stats .n { font-family: 'Alfa', serif; font-size: 19px; }
  .prof-stats .l { font-family: 'Momo', sans-serif; font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.4px; margin-top: 3px; }

  /* Mobile: collapse sidebar to an icon rail */
  @media (max-width: 780px) {
    .side { width: 74px; padding: 16px 10px; }
    .brand-sub, .nav-item span, .brand-title { display: none; }
    .side-head { justify-content: center; }
    .notif-btn { width: 44px; height: 44px; }
    .grad-divider { margin: 14px 2px; }
    .nav-item { justify-content: center; padding: 13px 0; }
    .inner { padding: 22px 16px 60px; }
  }

  /* ── HOME tab ─────────────────────────────────────────────────── */
  .home-greet { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
  .hg-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .hg-left dotlottie-wc { width: 46px; height: 46px; flex: 0 0 auto; }
  .hg-text { font-family: 'Alfa', serif; font-size: clamp(19px, 4.5vw, 23px); white-space: nowrap; }
  .hg-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; flex: 0 0 auto; flex-wrap: wrap; }
  .sugg-btn, .dale-btn { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    border-radius: 13px; font-family: 'Arch', sans-serif; font-weight: 700; font-size: 12.5px; transition: background 0.15s ease; }
  .sugg-btn { border: 1px solid rgba(247,151,30,0.4); background: rgba(247,151,30,0.12); color: #F7B955; padding: 9px 14px; }
  .sugg-btn:hover { background: rgba(247,151,30,0.2); }
  .sugg-btn svg { width: 16px; height: 16px; fill: currentColor; }
  .dale-btn { border: 1px solid rgba(142,84,233,0.45); background: rgba(142,84,233,0.16); color: #C6B3F5; padding: 5px 14px 5px 7px; }
  .dale-btn:hover { background: rgba(142,84,233,0.26); }
  .dale-btn dotlottie-wc { width: 30px; height: 30px; flex: 0 0 auto; }

  .home-actions { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .icon-btn { width: 48px; height: 48px; flex: 0 0 auto; border-radius: 14px; cursor: pointer; display: grid; place-items: center;
    border: 1px solid var(--hair); color: #fff; }
  .addpost-btn { background: linear-gradient(135deg, var(--g2), var(--g1)); border: 0; box-shadow: 0 8px 20px rgba(142,84,233,0.4); }
  .addpost-btn svg { width: 24px; height: 24px; fill: #fff; }
  .refresh-btn { background: var(--glass-2); color: var(--sub); }
  .refresh-btn:hover { background: rgba(255,255,255,0.14); color: var(--ink); }
  .refresh-btn svg { width: 21px; height: 21px; fill: currentColor; transition: transform 0.2s ease; }
  .refresh-btn.spinning svg { animation: rot 0.7s linear infinite; }
  .search-box { flex: 1; min-width: 0; height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 14px;
    border-radius: 14px; background: rgba(255,255,255,0.05); border: 1.5px solid var(--hair); transition: border-color 0.15s ease; }
  .search-box:focus-within { border-color: var(--g2); }
  .search-box svg { width: 19px; height: 19px; fill: var(--faint); flex: 0 0 auto; }
  .search-box input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--ink);
    font-family: 'Momo', sans-serif; font-size: 14px; }
  .search-box input::placeholder { color: var(--faint); }

  .feed-label { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .feed-label .eyebrow { font-family: 'Arch', sans-serif; font-weight: 700; font-size: 10px; letter-spacing: 1.5px; color: #B79BF3; }
  .feed-label .feed-title { font-family: 'Alfa', serif; font-size: 21px; margin-top: 2px; }
  .feed-label .post-count { font-family: 'Momo', sans-serif; font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums; }

  .feed-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; scrollbar-width: none; }
  .feed-tabs::-webkit-scrollbar { display: none; }
  .feed-tab { flex: 0 0 auto; cursor: pointer; border-radius: 20px; padding: 9px 18px; border: 1px solid var(--hair);
    background: var(--glass); color: var(--sub); font-family: 'Arch', sans-serif; font-weight: 700; font-size: 13px;
    transition: transform 0.2s cubic-bezier(0.22,0.61,0.36,1), background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease; }
  .feed-tab:hover { color: var(--ink); }
  .feed-tab.active { color: #fff; border-color: transparent; background: linear-gradient(90deg, var(--g2), var(--g1));
    box-shadow: 0 8px 18px rgba(142,84,233,0.35); }

  /* Post card — vertical list, full width, gradient border */
  .post { position: relative; padding: 0; margin-bottom: 14px; overflow: hidden; border-radius: 20px;
    background: rgba(255,255,255,0.05); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    box-shadow: 0 16px 40px rgba(0,0,0,0.3); }
  .post::before { content: ''; position: absolute; inset: 0; border-radius: 20px; padding: 1.6px; pointer-events: none;
    background: linear-gradient(135deg, var(--g1), var(--g2), var(--g3), var(--g4));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; }

  /* Google-Photos-style image grid (Events posters / Club posts) */
  .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 6px; }
  .photo { position: relative; aspect-ratio: 1; border: 0; cursor: pointer; border-radius: 12px; overflow: hidden;
    background-size: cover; background-position: center; background-color: var(--glass-2);
    transition: transform 0.15s ease; }
  .photo:hover { transform: scale(0.98); }
  .photo .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 24px 11px 9px; text-align: left;
    background: linear-gradient(transparent, rgba(0,0,0,0.82)); color: #fff; font-family: 'Arch', sans-serif;
    font-weight: 700; font-size: 11.5px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .photo .txtbody { position: absolute; inset: 0; padding: 13px; font-family: 'Momo', sans-serif; font-size: 12px;
    color: #fff; line-height: 1.5; overflow: hidden; text-align: left; }
  .post-top { display: flex; align-items: center; gap: 12px; padding: 15px 16px 0; }
  .post-av { width: 46px; height: 46px; border-radius: 50%; padding: 2px; flex: 0 0 auto;
    background: linear-gradient(135deg, var(--g2), var(--g1)); }
  .post-av .av { width: 100%; height: 100%; border: 2px solid #14121f; }
  .post-meta { min-width: 0; }
  .post-meta .pn { font-family: 'Arch', sans-serif; font-weight: 700; font-size: 14.5px; }
  .post-meta .ph { font-family: 'Momo', sans-serif; font-size: 11.5px; color: var(--faint); margin-top: 2px; }
  .post-text { padding: 12px 16px 0; font-family: 'Momo', sans-serif; font-size: 14px; line-height: 1.55; color: var(--ink); white-space: pre-wrap; word-break: break-word; }
  .post-media { margin: 12px 0 0; }
  .post-media img { display: block; width: 100%; max-height: 420px; object-fit: cover; }
  .post-actions { display: flex; gap: 8px; padding: 12px 14px; }
  .pa { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; border: 0; border-radius: 11px;
    padding: 8px 13px; background: var(--glass-2); color: var(--sub); font-family: 'Arch', sans-serif; font-weight: 700; font-size: 12.5px;
    transition: background 0.15s ease, color 0.15s ease; }
  .pa:hover { background: rgba(255,255,255,0.12); color: var(--ink); }
  .pa.like:hover { color: #FF6B7A; } .pa svg { width: 16px; height: 16px; fill: currentColor; }

  /* ── Study Hub tab ────────────────────────────────────────────── */
  .lockin-row { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
  .lockin-left { display: flex; align-items: center; gap: 11px; }
  .grad-icn { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; flex: 0 0 auto;
    background: linear-gradient(135deg, var(--g2), var(--g1)); box-shadow: 0 10px 22px rgba(142,84,233,0.35); }
  .grad-icn svg { width: 24px; height: 24px; fill: #fff; }
  .lockin-title { font-family: 'Alfa', serif; font-size: clamp(20px, 5vw, 25px); }
  .lockin-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .lib-btn { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; border-radius: 13px; padding: 9px 14px;
    border: 1px solid rgba(109,213,250,0.4); background: rgba(109,213,250,0.14); color: #8BD5F5;
    font-family: 'Arch', sans-serif; font-weight: 700; font-size: 12.5px; transition: background 0.15s ease; }
  .lib-btn:hover { background: rgba(109,213,250,0.24); }
  .lib-btn svg { width: 16px; height: 16px; fill: currentColor; }

  .sh-actions { display: flex; align-items: center; gap: 10px; margin: 16px 0 18px; }
  .sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin: 4px 0 14px; }
  .sec-head .sh-title { font-family: 'Alfa', serif; font-size: 19px; }
  .sec-head .eyebrow { font-family: 'Arch', sans-serif; font-weight: 700; font-size: 10px; letter-spacing: 1.5px; color: #B79BF3; display: block; margin-bottom: 2px; }
  .h-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 8px; scrollbar-width: none; }
  .h-scroll::-webkit-scrollbar { display: none; }
  .online-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #38EF7D; box-shadow: 0 0 6px #38EF7D; margin-right: 5px; }

  /* Group tile */
  .group-card { display: flex; flex-direction: column; margin: 0; padding: 0; overflow: hidden; border-radius: 18px; }
  .h-scroll .group-card { flex: 0 0 auto; width: 216px; }
  .grid2 .group-card { width: auto; }
  .gc-banner { height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; }
  .gc-badge { width: 48px; height: 48px; border-radius: 15px; display: grid; place-items: center; font-size: 26px;
    background: rgba(0,0,0,0.24); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25); }
  .gc-live { font-family: 'Arch', sans-serif; font-weight: 700; font-size: 10px; color: #fff; background: rgba(0,0,0,0.3);
    padding: 4px 8px; border-radius: 999px; display: inline-flex; align-items: center; gap: 5px; }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #38EF7D; box-shadow: 0 0 6px #38EF7D; }
  .gc-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
  .gc-name { font-family: 'Arch', sans-serif; font-weight: 700; font-size: 14.5px; line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .gc-sub { font-family: 'Momo', sans-serif; font-size: 11px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gc-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 10px; }
  .gc-members { font-family: 'Momo', sans-serif; font-size: 11.5px; color: var(--faint); display: inline-flex; align-items: center; gap: 5px; }
  .gc-members svg { width: 14px; height: 14px; fill: var(--faint); }
  .gc-foot .pillbtn { padding: 7px 14px; font-size: 12px; }

  /* Study buddy tile */
  .buddy-card { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 18px 14px 16px; margin: 0; }
  .buddy-av-wrap { position: relative; }
  .buddy-av-wrap .av { width: 62px; height: 62px; font-size: 21px; border: 2px solid rgba(56,239,125,0.65); }
  .buddy-online { position: absolute; right: 1px; bottom: 1px; width: 15px; height: 15px; border-radius: 50%;
    background: #38EF7D; border: 2.5px solid #14121f; box-shadow: 0 0 7px #38EF7D; }

  .bubble .bmedia img { display: block; max-width: 240px; max-height: 260px; border-radius: 10px; margin-bottom: 4px; }
  .conv-input .attach { width: 42px; height: 46px; flex: 0 0 auto; border: 0; background: none; cursor: pointer; display: grid; place-items: center; color: var(--sub); }
  .conv-input .attach:hover { color: var(--ink); }
  .conv-input .attach svg { width: 22px; height: 22px; fill: currentColor; }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; z-index: 200; background: var(--modal-scrim);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center; padding: 20px; }
  .modal { background: var(--card); }
  .modal-overlay.open { display: flex; }
  .modal { width: 100%; max-width: 460px; max-height: 86vh; overflow-y: auto; padding: 22px; }
  .modal-head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .modal-head .mi { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--g3), var(--g4)); }
  .modal-head .mi svg { width: 22px; height: 22px; fill: #fff; }

  .modal .sub { font-family: 'Momo', sans-serif; font-size: 12.5px; color: var(--sub); margin-bottom: 16px; line-height: 1.5; }
  .modal label { display: block; font-family: 'Arch', sans-serif; font-weight: 700; font-size: 12px; margin: 14px 0 7px; }
  .modal input, .modal textarea { width: 100%; background: rgba(255,255,255,0.05); border: 1.5px solid var(--hair);
    border-radius: 13px; padding: 13px 14px; color: var(--ink); font-family: 'Momo', sans-serif; font-size: 14px; outline: none; resize: vertical; }
  .modal input:focus, .modal textarea:focus { border-color: var(--g2); }
  .modal input::placeholder, .modal textarea::placeholder { color: var(--faint); }
  .cat-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .cat { cursor: pointer; border-radius: 999px; padding: 8px 13px; border: 1px solid var(--hair); background: var(--glass);
    color: var(--sub); font-family: 'Arch', sans-serif; font-weight: 700; font-size: 12px; }
  .cat.sel { background: linear-gradient(90deg, var(--g2), var(--g1)); color: #fff; border-color: transparent; }
</style>

<script src="assets/snackbar.js"></script>
<script>
  var API = 'https://tcs-nsw.duckdns.org/api';
  function tok() { try { return localStorage.getItem('tcs_access'); } catch (e) { return null; } }
  function cachedUser() { try { return JSON.parse(localStorage.getItem('tcs_user') || 'null'); } catch (e) { return null; } }
  function clearSession() { ['tcs_access','tcs_refresh','tcs_user'].forEach(function (k) { try { localStorage.removeItem(k); } catch (e) {} }); }
  if (!tok()) { location.replace('auth.html'); }

  function refreshToken() {
    var r; try { r = localStorage.getItem('tcs_refresh'); } catch (e) {}
    if (!r) return Promise.resolve(false);
    return fetch(API + '/accounts/token/refresh/', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh: r }) })
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (d) { if (d && d.access) { localStorage.setItem('tcs_access', d.access); if (d.refresh) localStorage.setItem('tcs_refresh', d.refresh); return true; } return false; })
      .catch(function () { return false; });
  }
  function authFetch(path, retry) {
    return fetch(API + path, { headers: { 'Authorization': 'Bearer ' + tok(), 'Accept': 'application/json' } })
      .then(function (res) {
        if (res.status === 401 && !retry) { return refreshToken().then(function (ok) { if (!ok) { clearSession(); location.replace('auth.html'); return Promise.reject('unauth'); } return authFetch(path, true); }); }
        // Tolerate non-JSON responses (HTML 404/500/502) so callers get a
        // status-aware message instead of a bare promise rejection.
        return res.text().then(function (body) {
          var d; try { d = body ? JSON.parse(body) : {}; } catch (e) {
            d = { detail: res.status === 404 ? 'This feature isn’t available yet.' : ('Server error (' + res.status + ').') };
          }
          return { ok: res.ok, status: res.status, d: d };
        });
      });
  }
  function listOf(d) { return Array.isArray(d) ? d : (d && (d.results || d.items || d.data)) || []; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }
  function initial(s) { s = String(s || '?').trim(); return (s[0] || '?').toUpperCase(); }
  function num(n) { return (n == null || isNaN(n)) ? 0 : n; }
  function avatar(url, name, cls) {
    return '<div class="av ' + (cls || '') + '">' + (url ? '<img src="' + esc(url) + '" alt="" />' : esc(initial(name))) + '</div>';
  }
  function timeAgo(iso) {
    if (!iso) return ''; var t = new Date(iso).getTime(); if (isNaN(t)) return '';
    var s = Math.floor((Date.now() - t) / 1000);
    if (s < 60) return 'now'; if (s < 3600) return Math.floor(s/60) + 'm';
    if (s < 86400) return Math.floor(s/3600) + 'h'; if (s < 604800) return Math.floor(s/86400) + 'd';
    return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }
  var view = document.getElementById('view');
  function loading() { view.innerHTML = '<div class="loading"><div class="spin"></div>Loading…</div>'; }
  function head(title, sub) { return '<div class="view-head"><h1>' + esc(title) + '</h1><p>' + esc(sub) + '</p></div>'; }
  function empty(msg) { return '<div class="empty">' + esc(msg) + '</div>'; }

  // ── HOME (feed) ──────────────────────────────────────────────
  var WAVE = 'https://lottie.host/f5271a44-8c77-49ee-9619-d28b556b78d0/tiMySH0cSe.lottie';
  var DALE = 'https://lottie.host/ac187fae-55ac-4ce4-93a9-fe037e3e2e57/jSdcU6a1Ig.lottie';
  function greeting() { var h = new Date().getHours(); return h < 12 ? 'Good morning' : (h < 17 ? 'Good afternoon' : 'Good evening'); }
  var FEED_TABS = [ { k: 'all', label: 'All' }, { k: 'following', label: 'Following' }, { k: 'events', label: 'Events' }, { k: 'clubs', label: 'Clubs' } ];
  var HOME = { tab: 'all', items: [], kind: 'posts' };

  function renderHome() {
    view.innerHTML =
      '<div class="home-greet">' +
        '<div class="hg-left"><dotlottie-wc src="' + WAVE + '" autoplay loop></dotlottie-wc>' +
        '<span class="hg-text">' + greeting() + '</span></div>' +
        '<div class="hg-actions">' +
          '<button class="sugg-btn" id="suggBtn"><svg viewBox="0 0 24 24"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"/></svg> Suggestion Box</button>' +
          '<button class="dale-btn" id="daleBtn"><dotlottie-wc src="' + DALE + '" autoplay loop></dotlottie-wc> Dale</button>' +
        '</div>' +
      '</div>' +
      '<div class="stories" id="stories"></div>' +
      '<div class="home-actions">' +
        '<button class="icon-btn addpost-btn" id="addPostBtn" title="New post"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg></button>' +
        '<div class="search-box"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5 1.5-1.5-5-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg><input id="feedSearch" placeholder="Search the feed" autocomplete="off" /></div>' +
        '<button class="icon-btn refresh-btn" id="refreshBtn" title="Refresh"><svg viewBox="0 0 24 24"><path d="M17.65 6.35A8 8 0 1 0 19.73 14h-2.08A6 6 0 1 1 12 6a5.9 5.9 0 0 1 4.2 1.8L13 11h7V4z"/></svg></button>' +
      '</div>' +
      '<div class="feed-label"><div><div class="eyebrow">LATEST</div><div class="feed-title">Campus Feed</div></div>' +
        '<span class="post-count" id="postCount"></span></div>' +
      '<div class="feed-tabs" id="feedTabs">' +
        FEED_TABS.map(function (t) { return '<button class="feed-tab' + (t.k === HOME.tab ? ' active' : '') + '" data-ft="' + t.k + '">' + t.label + '</button>'; }).join('') +
      '</div>' +
      '<div id="feedBody"></div>';

    document.getElementById('suggBtn').addEventListener('click', openSuggestionBox);
    document.getElementById('daleBtn').addEventListener('click', openStudyDale);
    document.getElementById('addPostBtn').addEventListener('click', openCreatePost);
    document.getElementById('refreshBtn').addEventListener('click', function () { this.classList.add('spinning'); loadFeedTab(); });
    document.getElementById('feedSearch').addEventListener('input', function () { filterFeed(this.value); });
    document.getElementById('feedTabs').addEventListener('click', function (e) {
      var b = e.target.closest('[data-ft]'); if (!b) return;
      HOME.tab = b.getAttribute('data-ft');
      this.querySelectorAll('.feed-tab').forEach(function (x) { x.classList.toggle('active', x.getAttribute('data-ft') === HOME.tab); });
      var s = document.getElementById('feedSearch'); if (s) s.value = '';
      loadFeedTab();
    });
    loadStories();
    loadFeedTab();
  }

  // ── Story highlights (grouped by owner) ──────────────────────
  // Highlights expire after 24h — keep only those whose newest timestamp
  // (own created_at, or newest item) is under 24 hours old, matching the
  // mobile feed's _isFresh filter.
  function isFreshHighlight(h) {
    var newest = null;
    function consider(iso) { if (!iso) return; var t = new Date(iso).getTime(); if (!isNaN(t) && (newest === null || t > newest)) newest = t; }
    consider(h.created_at);
    (h.items || []).forEach(function (it) { consider(it && it.created_at); });
    if (newest === null) return true;
    return (Date.now() - newest) < 24 * 3600 * 1000;
  }
  function loadStories() {
    var row = document.getElementById('stories'); if (!row) return;
    authFetch('/highlights/feed/').then(function (r) {
      var el = document.getElementById('stories'); if (!el) return;
      if (!r.ok) { el.style.display = 'none'; return; }
      var hs = listOf(r.d).filter(isFreshHighlight);
      // group by owner_id, preserving first-seen order
      var order = [], map = {};
      hs.forEach(function (h) { var k = h.owner_id || h.owner_name || h.id; if (!map[k]) { map[k] = { owner: h.owner_name, cover: h.cover_url, items: [] }; order.push(k); } map[k].items.push(h); });
      if (!order.length) { el.style.display = 'none'; return; }
      el.style.display = 'flex';
      el.innerHTML = order.map(function (k, i) {
        var g = map[k];
        return '<button class="story" data-story="' + i + '"><span class="story-ring">' + avatar(g.cover, g.owner, 'story-av') + '</span>' +
          '<span class="story-name">' + esc((g.owner || 'You').split(' ')[0]) + '</span></button>';
      }).join('');
      HOME.storyGroups = order.map(function (k) { return map[k]; });
      el.querySelectorAll('[data-story]').forEach(function (b) { b.addEventListener('click', function () { openStoryViewer(parseInt(b.getAttribute('data-story'), 10)); }); });
    }).catch(function () { var el = document.getElementById('stories'); if (el) el.style.display = 'none'; });
  }
  function openStoryViewer(groupIdx) {
    var groups = HOME.storyGroups || []; var group = groups[groupIdx]; if (!group) return;
    playStory(group.items.map(function (h) { return h.id; }), group.owner);
  }
  function playStory(ids, owner) {
    if (!ids || !ids.length) { window.snack('No stories to show.', 'info'); return; }
    var group = { owner: owner, items: ids.map(function (id) { return { id: id }; }) };
    var ov = document.createElement('div'); ov.className = 'story-viewer'; ov.id = 'storyViewer';
    ov.innerHTML = '<div class="sv-inner"><div class="sv-bars" id="svBars"></div>' +
      '<div class="sv-head"><span class="sv-owner">' + esc(group.owner || '') + '</span><button class="sv-close" id="svClose"><svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="#fff"/></svg></button></div>' +
      '<div class="sv-stage" id="svStage"><div class="loading"><div class="spin"></div></div></div>' +
      '<button class="sv-nav prev" id="svPrev"></button><button class="sv-nav next" id="svNext"></button></div>';
    document.body.appendChild(ov);
    var stories = [], idx = 0, timer = null;
    function cleanup() { if (timer) { clearTimeout(timer); timer = null; } ov.remove(); }
    document.getElementById('svClose').addEventListener('click', cleanup);
    ov.addEventListener('click', function (e) { if (e.target === ov) cleanup(); });
    function bars() {
      document.getElementById('svBars').innerHTML = stories.map(function (s, i) {
        return '<span class="sv-bar"><i style="width:' + (i < idx ? 100 : (i === idx ? 100 : 0)) + '%;transition:' + (i === idx ? 'width 4s linear' : 'none') + '"></i></span>';
      }).join('');
    }
    function show() {
      if (idx < 0) idx = 0; if (idx >= stories.length) { cleanup(); return; }
      var s = stories[idx]; var stage = document.getElementById('svStage'); if (!stage) return;
      stage.innerHTML = s.media_type === 'video'
        ? '<video src="' + esc(s.url) + '" autoplay playsinline ' + (s.thumbnail_url ? 'poster="' + esc(s.thumbnail_url) + '"' : '') + '></video>'
        : '<img src="' + esc(s.url || s.thumbnail_url) + '" alt="" />';
      bars();
      if (timer) clearTimeout(timer);
      if (s.media_type !== 'video') timer = setTimeout(function () { idx++; show(); }, 4200);
      else { var v = stage.querySelector('video'); if (v) v.addEventListener('ended', function () { idx++; show(); }); }
    }
    document.getElementById('svPrev').addEventListener('click', function () { idx--; if (idx < 0) idx = 0; show(); });
    document.getElementById('svNext').addEventListener('click', function () { idx++; show(); });
    // fetch items for each highlight in the group, in order
    var ids = group.items.map(function (h) { return h.id; });
    Promise.all(ids.map(function (id) { return authFetch('/highlights/' + id + '/').then(function (r) { return r.ok ? r.d : null; }).catch(function () { return null; }); }))
      .then(function (results) {
        results.forEach(function (d) { if (d && d.items) { d.items.slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); }).forEach(function (it) { stories.push(it); }); } });
        if (!stories.length) { cleanup(); window.snack('No stories to show.', 'info'); return; }
        show();
      });
  }

  function setPostCount(n) {
    var el = document.getElementById('postCount'); if (!el) return;
    var noun = HOME.kind === 'events' ? 'events' : 'posts';
    el.textContent = n ? (n + ' ' + noun) : '';
  }
  function loadFeedTab() {
    var body = document.getElementById('feedBody');
    body.innerHTML = '<div class="loading"><div class="spin"></div>Loading…</div>';
    var tab = HOME.tab, path;
    if (tab === 'all') { path = '/posts/feed/?type=home&page=1'; HOME.kind = 'posts'; }
    else if (tab === 'following') { path = '/posts/feed/?type=following&page=1'; HOME.kind = 'posts'; }
    else if (tab === 'events') { path = '/clubs/events-feed/?page=1'; HOME.kind = 'events'; }
    else { path = '/posts/feed/?type=club_posts&page=1'; HOME.kind = 'clubposts'; }
    authFetch(path).then(function (r) {
      var rb = document.getElementById('refreshBtn'); if (rb) rb.classList.remove('spinning');
      if (!r.ok) { HOME.items = []; setPostCount(0); body.innerHTML = empty((r.d && r.d.detail) || 'Couldn’t load the feed.'); return; }
      HOME.items = listOf(r.d);
      renderFeedItems(HOME.items);
    }).catch(function () {
      var rb = document.getElementById('refreshBtn'); if (rb) rb.classList.remove('spinning');
      body.innerHTML = empty('Couldn’t load the feed.'); window.snack('Couldn’t load the feed', 'error');
    });
  }
  function renderFeedItems(items) {
    var body = document.getElementById('feedBody'); if (!body) return;
    setPostCount(items.length);
    if (!items.length) { body.innerHTML = empty('Nothing here yet.'); return; }
    if (HOME.kind === 'posts') { body.innerHTML = items.map(postCard).join(''); wirePostActions(body); }
    else if (HOME.kind === 'events') { body.innerHTML = '<div class="photo-grid">' + items.map(eventPhoto).join('') + '</div>'; body.querySelectorAll('[data-photo]').forEach(function (b, i) { b.addEventListener('click', function () { openEvent(items[i]); }); }); }
    else { body.innerHTML = items.map(postCard).join(''); wirePostActions(body); }
  }
  function openEvent(e) {
    if (!e) return;
    var img = e.card_url || e.poster_url || e.image_url || e.cover_url;
    var when = e.starts_at || e.start_time || e.date || e.event_date;
    openModal('<div class="ev-modal">' +
      (img ? '<div class="ev-poster" style="background-image:url(' + esc(img) + ')"></div>' : '') +
      '<button class="ghost x" id="mClose" style="position:absolute;top:14px;right:14px;padding:8px 10px;z-index:2"><svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>' +
      '<div class="ev-body"><h2 style="font-family:Alfa;font-size:20px">' + esc(e.title || e.name || 'Event') + '</h2>' +
      (e.club_name || e.host_name ? '<div class="faint" style="font-family:Momo;font-size:12px;margin-top:4px">by ' + esc(e.club_name || e.host_name) + '</div>' : '') +
      (when ? '<div class="ev-when">🗓️ ' + esc(new Date(when).toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })) + '</div>' : '') +
      (e.location ? '<div class="ev-when">📍 ' + esc(e.location) + '</div>' : '') +
      (e.description ? '<div class="post-text" style="margin-top:12px">' + linkify(e.description) + '</div>' : '') + '</div></div>');
    document.getElementById('mClose').addEventListener('click', closeModal);
  }
  function filterFeed(q) {
    q = (q || '').toLowerCase().trim();
    if (!q) { renderFeedItems(HOME.items); return; }
    renderFeedItems(HOME.items.filter(function (it) { return JSON.stringify(it).toLowerCase().indexOf(q) >= 0; }));
  }
  function postAuthor(p) {
    var a = p.author || p.user || {};
    return { name: p.author_name || a.name || a.display_name || 'Someone', handle: p.author_id || a.user_id || a.username || 'user',
      avatar: p.author_avatar || a.avatar_url, role: p.author_role || a.role };
  }
  function postMediaHtml(p) {

      '<div class="modal-head"><div class="mi"><svg viewBox="0 0 24 24"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"/></svg></div>' +
      '<h2>Suggestion Box</h2><button class="ghost x" id="mClose" style="padding:8px 10px"><svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button></div>' +
      '<p class="sub">Got an idea to make TCS better? Tell the team.</p>' +
      '<label>Category</label><div class="cat-row" id="catRow"><span class="faint" style="font-size:12px;font-family:Momo">Loading…</span></div>' +
      '<label>Title</label><input id="sgTitle" placeholder="A short summary" maxlength="120" />' +
      '<label>Your suggestion</label><textarea id="sgMsg" rows="4" placeholder="Describe your idea…"></textarea>' +
      '<button class="btn" id="sgSubmit" style="margin-top:18px"><span class="spinner" style="width:18px;height:18px;border:2.5px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;display:none"></span><span>Send suggestion</span></button>'
    );
    document.getElementById('mClose').addEventListener('click', closeModal);
    var sel = { id: '' };
    authFetch('/feedback/categories/').then(function (r) {
      var cats = listOf(r.d); var row = document.getElementById('catRow');
      if (!r.ok || !cats.length) { row.innerHTML = '<span class="faint" style="font-size:12px;font-family:Momo">' + esc((r.d && r.d.detail) || 'No categories') + '</span>'; return; }
      row.innerHTML = cats.map(function (c, i) { return '<button type="button" class="cat' + (i === 0 ? ' sel' : '') + '" data-cat="' + esc(c.id || c.slug || c.value) + '">' + esc(c.label || c.name) + '</button>'; }).join('');
      sel.id = (cats[0].id || cats[0].slug || cats[0].value);
      row.addEventListener('click', function (e) { var b = e.target.closest('[data-cat]'); if (!b) return; sel.id = b.getAttribute('data-cat'); row.querySelectorAll('.cat').forEach(function (x) { x.classList.toggle('sel', x === b); }); });
    }).catch(function () {});
    document.getElementById('sgSubmit').addEventListener('click', function () {
      var title = document.getElementById('sgTitle').value.trim(), msg = document.getElementById('sgMsg').value.trim();
      if (!title || !msg) { window.snack('Add a title and your suggestion.', 'error'); return; }
      var btn = this; btn.disabled = true; btn.querySelector('.spinner').style.display = 'inline-block'; btn.querySelector('span:last-child').textContent = 'Sending…';
      fetch(API + '/feedback/suggest/', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok(), 'Accept': 'application/json' },
        body: JSON.stringify({ title: title, message: msg, category: sel.id }) })
        .then(function (res) { return res.json().then(function (d) { return { ok: res.ok, d: d }; }); })
        .then(function (res) {
          if (!res.ok) { window.snack((res.d && (res.d.detail || res.d.error)) || 'Couldn’t send — please try again.', 'error'); btn.disabled = false; btn.querySelector('.spinner').style.display = 'none'; btn.querySelector('span:last-child').textContent = 'Send suggestion'; return; }
          closeModal(); window.snack('Thanks! Your suggestion was sent.', 'ok');
        })
        .catch(function () { window.snack('Couldn’t reach the server.', 'error'); btn.disabled = false; btn.querySelector('.spinner').style.display = 'none'; btn.querySelector('span:last-child').textContent = 'Send suggestion'; });
    });
  }

  var SEARCH_SVG = '<svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5 1.5-1.5-5-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>';

  function renderListTab(o) {
    view.innerHTML =
      '<div class="feed-label"><div><div class="eyebrow">' + o.eyebrow + '</div><div class="feed-title">' + esc(o.title) + '</div></div>' +
        '<span class="post-count" id="ltCount"></span></div>' +
      '<div class="home-actions">' + (o.action || '') +
        '<div class="search-box">' + SEARCH_SVG + '<input id="ltSearch" placeholder="' + esc(o.searchPh || 'Search') + '" autocomplete="off" /></div>' +
        '<button class="icon-btn refresh-btn" id="ltRefresh" title="Refresh">' + REFRESH_SVG + '</button>' +
      '</div><div id="ltBody"></div>';
    var state = { items: [] };
    function setCount(n) { var el = document.getElementById('ltCount'); if (el) el.textContent = n ? (n + ' ' + o.noun) : ''; }
    function draw(items) {
      var body = document.getElementById('ltBody'); if (!body) return;
      setCount(items.length);
      if (!items.length) { body.innerHTML = empty('Nothing here yet.'); return; }
      body.innerHTML = o.grid ? '<div class="grid2">' + items.map(o.cardFn).join('') + '</div>' : items.map(o.cardFn).join('');
      if (o.wireFn) o.wireFn(body);
    }
    function load() {
      var body = document.getElementById('ltBody'); body.innerHTML = '<div class="loading"><div class="spin"></div>Loading…</div>';
      authFetch(o.path).then(function (r) {
        var rb = document.getElementById('ltRefresh'); if (rb) rb.classList.remove('spinning');
        if (!r.ok) { state.items = []; setCount(0); body.innerHTML = empty((r.d && r.d.detail) || 'Couldn’t load.'); return; }
        state.items = listOf(r.d); draw(state.items);
      }).catch(function () { var rb = document.getElementById('ltRefresh'); if (rb) rb.classList.remove('spinning'); body.innerHTML = empty('Couldn’t load.'); window.snack('Couldn’t load', 'error'); });
    }
    document.getElementById('ltRefresh').addEventListener('click', function () { this.classList.add('spinning'); load(); });
    document.getElementById('ltSearch').addEventListener('input', function () {
      var q = this.value.toLowerCase().trim();
      draw(q ? state.items.filter(function (it) { return JSON.stringify(it).toLowerCase().indexOf(q) >= 0; }) : state.items);
    });
    if (o.action && o.onAction) { var ab = document.getElementById('ltAction'); if (ab) ab.addEventListener('click', o.onAction); }
    load();
  }

  function paintAvailPill() {

  function toggleAvail() {
    var b = document.getElementById('shAvail'); if (!b || b.classList.contains('busy')) return;

    var subjects = ((cachedUser() || {}).study_subjects) || '';

    fetch(API + '/groups/buddies/me/', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok(), 'Accept': 'application/json' }, body: JSON.stringify({ available: goOn, subjects: subjects }) })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        b.classList.remove('busy');

  function renderGroups() {
    var body = document.getElementById('shBody');
    body.innerHTML =
      '<div class="sh-actions">' +
        '<button class="icon-btn addpost-btn" id="grpCreate" title="Create group"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg></button>' +

      '<div id="myGroups"><div class="loading"><div class="spin"></div></div></div>' +

      '<div id="suggGroups"><div class="loading"><div class="spin"></div></div></div>';

  function wireGroupBtns(root) {
    root.querySelectorAll('[data-group]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-group');
        if (b.getAttribute('data-joined')) { openGroup(id); }
        else { joinGroup(id, b); }
      });
    });
  }
  function joinGroup(id, btn) {
    if (btn) { btn.disabled = true; btn.textContent = 'Joining…'; }
    fetch(API + '/groups/' + id + '/join/', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok(), 'Accept': 'application/json' } })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }).catch(function () { return { ok: r.ok, d: {} }; }); })
      .then(function (res) {
        if (!res.ok) { window.snack((res.d && (res.d.detail || res.d.error)) || 'Couldn’t join the group.', 'error'); if (btn) { btn.disabled = false; btn.textContent = 'Join'; } return; }
        window.snack((res.d && res.d.pending) ? 'Request sent — awaiting approval' : 'Joined the group!', 'ok');
        if (SH.tab === 'groups') renderSHBody();
        if (res.d && res.d.id && !(res.d.pending)) openGroup(id);
      }).catch(function () { window.snack('Couldn’t reach the server.', 'error'); if (btn) { btn.disabled = false; btn.textContent = 'Join'; } });
  }
  function matIcon(t) {
    t = (t || '').toLowerCase();
    if (/pdf/.test(t)) return '📕'; if (/(png|jpe?g|gif|webp|image)/.test(t)) return '🖼️';
    if (/(doc|word)/.test(t)) return '📘'; if (/(ppt|slide)/.test(t)) return '📙';
    if (/(xls|sheet|csv)/.test(t)) return '📗'; if (/(zip|rar|7z)/.test(t)) return '🗜️';
    if (/(mp4|mov|video)/.test(t)) return '🎬'; if (/(mp3|wav|audio)/.test(t)) return '🎧';
    return '📄';
  }
  function materialRow(m) {
    var url = m.file_url || '#';
    return '<a class="lib-item" href="' + esc(url) + '" target="_blank" rel="noopener">' +
      '<span class="lib-ic">' + matIcon(m.file_type || m.file_name) + '</span>' +
      '<span class="lib-meta"><span class="lib-title">' + esc(m.title || m.file_name || 'Material') + '</span>' +
      '<span class="lib-sub">' + esc([m.subject || m.group_name || m.uploaded_by_name, m.file_type].filter(Boolean).join(' · ')) + '</span></span>' +
      '<span class="lib-dl"><svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" fill="currentColor"/></svg></span></a>';
  }
  function groupMsgBubble(m, meId) {
    var mine = m.author_id && meId && String(m.author_id) === String(meId);
    var ai = m.is_ai || m.author_role === 'ai' || (m.author_name === 'Dale');
    var media = (m.media && m.media.length && m.media[0].url) ? '<div class="bmedia"><img src="' + esc(m.media[0].url) + '" alt="" /></div>' : '';
    var txt = m.content ? esc(m.content) : '';
    var bub = '<div class="bubble ' + (mine ? 'me' : (ai ? 'ai' : 'them')) + '">' +
      (!mine ? '<div class="sender">' + esc(ai ? 'Dale' : (m.author_name || 'Member')) + '</div>' : '') +
      media + (txt ? '<span>' + txt + '</span>' : '') +
      '<div class="bfoot">' + esc(timeHM(m.created_at)) + '</div></div>';
    if (mine) return '<div class="msg-row me">' + bub + '</div>';
    var av = ai ? '<span class="av mav dale-mini"><dotlottie-wc src="' + DALE + '" autoplay loop></dotlottie-wc></span>' : avatar(m.author_avatar, m.author_name, 'mav');
    return '<div class="msg-row them">' + av + bub + '</div>';
  }
  function loadGroupChat(id) {
    var feed = document.getElementById('gchatFeed'); if (!feed) return;
    var meId = (cachedUser() || {}).user_id || '';
    authFetch('/posts/?group_id=' + id).then(function (r) {
      var f = document.getElementById('gchatFeed'); if (!f) return;
      if (!r.ok) { f.innerHTML = empty((r.d && r.d.detail) || (r.status === 403 ? 'Join the group to see the chat.' : 'Couldn’t load the chat.')); return; }
      var msgs = listOf(r.d).slice().reverse();
      if (!msgs.length) { f.innerHTML = '<div class="conv-empty" style="min-height:200px">Say hi to your group 👋</div>'; return; }
      f.innerHTML = msgs.map(function (m) { return groupMsgBubble(m, meId); }).join('');
      f.scrollTop = f.scrollHeight;
    }).catch(function () { var f = document.getElementById('gchatFeed'); if (f) f.innerHTML = empty('Couldn’t load the chat.'); });
  }
  function sendGroupMsg(id) {

  var LIB = { all: [], type: 'All', q: '' };
  var LIB_TYPES = ['All', 'PDF', 'Doc', 'Audio', 'Image', 'Video', 'Other'];
  function libBucket(t) {
    t = (t || '').toLowerCase();
    if (/pdf/.test(t)) return 'PDF';
    if (/(png|jpe?g|gif|webp|image|heic)/.test(t)) return 'Image';
    if (/(mp4|mov|mkv|webm|video)/.test(t)) return 'Video';
    if (/(mp3|wav|m4a|aac|ogg|audio)/.test(t)) return 'Audio';
    if (/(doc|word|txt|ppt|slide|xls|sheet|csv|rtf|pages|key)/.test(t)) return 'Doc';
    return 'Other';
  }
  function libItemHtml(m) {
    return '<div class="lib-item" data-mat="' + esc(m.id) + '">' +
      '<a class="lib-open" href="' + esc(m.file_url || '#') + '" target="_blank" rel="noopener"><span class="lib-ic">' + matIcon(m.file_type || m.file_name) + '</span>' +
      '<span class="lib-meta"><span class="lib-title">' + esc(m.title || m.file_name || 'Material') + '</span>' +
      '<span class="lib-sub">' + esc([m.subject, m.source_group_name || m.source_name, m.file_type].filter(Boolean).join(' · ')) + '</span></span></a>' +
      '<button class="lib-quiz" data-quiz="' + esc(m.id) + '" title="Quiz me on this"><dotlottie-wc src="' + DALE + '" autoplay loop></dotlottie-wc></button>' +
      '<button class="lib-del" data-del="' + esc(m.id) + '" title="Remove"><svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" fill="currentColor"/></svg></button></div>';
  }
  function libApplyFilter() {
    var el = document.getElementById('libList'); if (!el) return;
    var q = LIB.q.toLowerCase().trim();
    var list = LIB.all.filter(function (m) {
      var typeOk = LIB.type === 'All' || libBucket(m.file_type || m.file_name) === LIB.type;
      var hay = [m.title, m.file_name, m.subject, m.source_group_name, m.source_name].join(' ').toLowerCase();
      return typeOk && (!q || hay.indexOf(q) >= 0);
    });
    if (!list.length) { el.innerHTML = empty(LIB.all.length ? 'No materials match your search or filter.' : 'Nothing saved yet. Save materials from a group or chat to see them here.'); return; }
    el.innerHTML = list.map(libItemHtml).join('');
    el.querySelectorAll('[data-del]').forEach(function (b) { b.addEventListener('click', function () {
      var id = b.getAttribute('data-del'); var row = b.closest('.lib-item'); row.style.opacity = '.4';
      fetch(API + '/chat/saved/' + id + '/delete/', { method: 'POST', headers: { 'Authorization': 'Bearer ' + tok() } })
        .then(function (rr) { if (!rr.ok) throw 0; LIB.all = LIB.all.filter(function (x) { return x.id !== id; }); libApplyFilter(); window.snack('Removed from library', 'ok'); })
        .catch(function () { row.style.opacity = '1'; window.snack('Couldn’t remove.', 'error'); });
    }); });
    el.querySelectorAll('[data-quiz]').forEach(function (b) { b.addEventListener('click', function () {
      var id = b.getAttribute('data-quiz'); var mat = LIB.all.filter(function (x) { return x.id === id; })[0];
      openQuizSetup(mat);
    }); });
  }

      '<button class="btn" id="qGen" style="margin-top:18px"><span class="spinner" style="width:18px;height:18px;border:2.5px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;display:none"></span><span>Generate quiz</span></button>');
    document.getElementById('mClose').addEventListener('click', closeModal);
    document.getElementById('qGen').addEventListener('click', function () {
      var types = []; document.querySelectorAll('.qtypes input:checked').forEach(function (c) { types.push(c.value); });
      if (!types.length) { window.snack('Pick at least one question type.', 'error'); return; }
      var btn = this; btn.disabled = true; btn.querySelector('.spinner').style.display = 'inline-block'; btn.querySelector('span:last-child').textContent = 'Generating… (a few seconds)';

      fetch(API + '/chat/rooms/' + roomId + '/messages/', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok(), 'Accept': 'application/json' }, body: JSON.stringify({ text: text }) })

      .catch(function () { window.snack('Upload failed.', 'error'); });

  // ── Voice recording ──────────────────────────────────────────
  var REC = { rec: null, stream: null, chunks: [], timer: null, secs: 0, saved: '', mime: 'audio/webm', ext: 'webm' };
  function pickAudioMime() {
    var MR = window.MediaRecorder;
    if (MR && MR.isTypeSupported) {
      if (MR.isTypeSupported('audio/webm;codecs=opus')) return { m: 'audio/webm;codecs=opus', up: 'audio/webm', ext: 'webm' };
      if (MR.isTypeSupported('audio/webm')) return { m: 'audio/webm', up: 'audio/webm', ext: 'webm' };
      if (MR.isTypeSupported('audio/ogg;codecs=opus')) return { m: 'audio/ogg;codecs=opus', up: 'audio/ogg', ext: 'ogg' };
      if (MR.isTypeSupported('audio/mp4')) return { m: 'audio/mp4', up: 'audio/mp4', ext: 'm4a' };
    }
    return { m: '', up: 'audio/webm', ext: 'webm' };
  }
  function fmtSecs(s) { var m = Math.floor(s / 60), r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r; }
  function teardownRec() {
    if (REC.timer) { clearInterval(REC.timer); REC.timer = null; }
    if (REC.stream) { REC.stream.getTracks().forEach(function (t) { t.stop(); }); REC.stream = null; }
    REC.rec = null; REC.chunks = [];
  }
  function restoreInputRow() {
    var mic = document.getElementById('convMic'), text = document.getElementById('convText'), att = document.getElementById('convAttach'), send = document.getElementById('convSend');
    var bar = document.getElementById('recBar'), cancel = document.getElementById('recCancel');
    if (bar) bar.remove(); if (cancel) cancel.remove();
    if (att) att.style.display = ''; if (text) text.style.display = ''; if (mic) mic.style.display = '';
    if (send) send.title = '';
  }
  function startRecording(roomId) {
    if (REC.rec) return;
    if (!navigator.mediaDevices || !window.MediaRecorder) { window.snack('Voice recording isn’t supported on this browser.', 'error'); return; }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      var pick = pickAudioMime(); REC.mime = pick.up; REC.ext = pick.ext;
      var rec = pick.m ? new MediaRecorder(stream, { mimeType: pick.m }) : new MediaRecorder(stream);
      REC.rec = rec; REC.stream = stream; REC.chunks = []; REC.secs = 0;
      rec.ondataavailable = function (e) { if (e.data && e.data.size) REC.chunks.push(e.data); };
      rec.onstop = function () {
        var blob = new Blob(REC.chunks, { type: REC.mime });
        teardownRec(); restoreInputRow();
        if (REC.saved === 'cancel' || !blob.size) return;
        var file = new File([blob], 'voice_message.' + REC.ext, { type: REC.mime });
        sendMedia(roomId, file);
      };
      rec.start();
      // Swap the input row into recording mode.
      var mic = document.getElementById('convMic'), text = document.getElementById('convText'), att = document.getElementById('convAttach'), send = document.getElementById('convSend');
      if (att) att.style.display = 'none'; if (text) text.style.display = 'none'; if (mic) mic.style.display = 'none';
      var bar = document.createElement('div'); bar.className = 'rec-bar'; bar.id = 'recBar';
      bar.innerHTML = '<span class="dot"></span><span class="rt" id="recTime">0:00</span><span class="lbl">Recording…</span>';
      var cancel = document.createElement('button'); cancel.className = 'rec-cancel'; cancel.id = 'recCancel'; cancel.title = 'Cancel';
      cancel.innerHTML = '<svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>';
      var input = document.getElementById('convInput');
      input.insertBefore(cancel, send); input.insertBefore(bar, cancel);
      if (send) send.title = 'Send voice message';
      cancel.addEventListener('click', function () { REC.saved = 'cancel'; try { rec.stop(); } catch (e) { teardownRec(); restoreInputRow(); } });
      REC.saved = '';
      REC.timer = setInterval(function () {
        REC.secs++; var t = document.getElementById('recTime'); if (t) t.textContent = fmtSecs(REC.secs);
        if (REC.secs >= 300) { REC.saved = ''; try { rec.stop(); } catch (e) {} } // 5-min cap
      }, 1000);
    }).catch(function () { window.snack('Microphone permission denied.', 'error'); });
  }

  function loadMessages(roomId, silent) {
    var body = document.getElementById('convBody');
    if (!body || MSG.active !== roomId) { stopPoll(); return; }
    if (!silent) body.innerHTML = '<div class="loading"><div class="spin"></div></div>';

      var b = document.getElementById('convBody'); if (!b || MSG.active !== roomId) return;

      if (!msgs.length) { b.innerHTML = '<div class="conv-empty">No messages yet — say hi! 👋</div>'; MSG.lastCount = 0; return; }

  function wireUserRows(el) {
    el.querySelectorAll('[data-chat]').forEach(function (b) {

  // ── Game: Snake ──────────────────────────────────────────────
  function gameSnake(ctx) {
    var N = 17, CELL = 20, W = N * CELL;
    ctx.stage.innerHTML = '<canvas id="snk" width="' + W + '" height="' + W + '" class="game-canvas"></canvas>';
    ctx.foot.innerHTML = '<span class="game-hint">Arrow keys or WASD to move</span>';
    var cv = document.getElementById('snk'), g = cv.getContext('2d');
    var snake = [{ x: 8, y: 8 }], dir = { x: 1, y: 0 }, queue = [], food = rndFood(), score = 0, speed = 110;
    function rndFood() { var f; do { f = { x: (Math.random() * N) | 0, y: (Math.random() * N) | 0 }; } while (snake.some(function (s) { return s.x === f.x && s.y === f.y; })); return f; }
    GAME.keys = function (e) {
      var k = e.key.toLowerCase(), nd = null;
      if (k === 'arrowup' || k === 'w') nd = { x: 0, y: -1 };
      else if (k === 'arrowdown' || k === 's') nd = { x: 0, y: 1 };
      else if (k === 'arrowleft' || k === 'a') nd = { x: -1, y: 0 };
      else if (k === 'arrowright' || k === 'd') nd = { x: 1, y: 0 };
      else return;
      e.preventDefault();
      var last = queue.length ? queue[queue.length - 1] : dir;
      if ((nd.x === -last.x && nd.y === -last.y) || (nd.x === last.x && nd.y === last.y)) return; // no reverse / duplicate
      if (queue.length < 2) queue.push(nd);
    };
    document.addEventListener('keydown', GAME.keys);
    function draw() {
      g.fillStyle = 'rgba(8,6,15,1)'; g.fillRect(0, 0, W, W);
      g.strokeStyle = 'rgba(0,229,255,.06)'; for (var i = 0; i <= N; i++) { g.beginPath(); g.moveTo(i * CELL, 0); g.lineTo(i * CELL, W); g.moveTo(0, i * CELL); g.lineTo(W, i * CELL); g.stroke(); }
      g.fillStyle = '#FF3DCB'; g.shadowColor = '#FF3DCB'; g.shadowBlur = 12; g.beginPath(); g.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 3, 0, 7); g.fill();
      snake.forEach(function (s, i) { g.fillStyle = i === 0 ? '#7CFF6B' : '#00E5FF'; g.shadowColor = i === 0 ? '#7CFF6B' : '#00E5FF'; g.shadowBlur = 10; g.fillRect(s.x * CELL + 1.5, s.y * CELL + 1.5, CELL - 3, CELL - 3); });
      g.shadowBlur = 0;
    }
    function step() {
      if (queue.length) dir = queue.shift(); var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N || snake.some(function (s) { return s.x === head.x && s.y === head.y; })) { ctx.over(score); return; }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) { score += 10; ctx.setScore(score); food = rndFood(); if (speed > 70) { speed -= 4; clearInterval(GAME.iv); GAME.iv = setInterval(step, speed); } }
      else snake.pop();
      draw();
    }
    draw(); GAME.iv = setInterval(step, speed);
  }

  // ── Game: Tic-Tac-Toe (vs unbeatable AI) ─────────────────────
  function gameTTT(ctx) {
    var b = ['', '', '', '', '', '', '', '', ''], done = false;
    ctx.foot.innerHTML = '<span class="game-hint">You’re ✕ · beat the AI for 100, draw for 30</span>';
    function wins(bd, p) { var L = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]; return L.some(function (l) { return l.every(function (i) { return bd[i] === p; }); }); }
    function full(bd) { return bd.every(function (c) { return c; }); }
    function mini(bd, ai) { if (wins(bd, 'O')) return 10; if (wins(bd, 'X')) return -10; if (full(bd)) return 0;
      var best = ai ? -99 : 99;
      for (var i = 0; i < 9; i++) if (!bd[i]) { bd[i] = ai ? 'O' : 'X'; var s = mini(bd, !ai); bd[i] = ''; best = ai ? Math.max(best, s) : Math.min(best, s); }
      return best; }
    function aiMove() { var bi = -1, bs = -99; for (var i = 0; i < 9; i++) if (!b[i]) { b[i] = 'O'; var s = mini(b, false); b[i] = ''; if (s > bs) { bs = s; bi = i; } } if (bi >= 0) b[bi] = 'O'; }
    function finish(msg, score, cls) { done = true; render(); ctx.setScore(score); setTimeout(function () { ctx.over(score); }, 700); }
    function render() {
      ctx.stage.innerHTML = '<div class="ttt">' + b.map(function (c, i) { return '<button class="ttt-cell ' + (c === 'X' ? 'x' : c === 'O' ? 'o' : '') + '" data-i="' + i + '"' + (c || done ? ' disabled' : '') + '>' + (c || '') + '</button>'; }).join('') + '</div>';
      ctx.stage.querySelectorAll('[data-i]').forEach(function (el) { el.addEventListener('click', function () {
        var i = +el.getAttribute('data-i'); if (b[i] || done) return; b[i] = 'X';
        if (wins(b, 'X')) return finish('win', 100); if (full(b)) return finish('draw', 30);
        aiMove(); if (wins(b, 'O')) return finish('loss', 0); if (full(b)) return finish('draw', 30); render();
      }); });
    }
    render();
  }

  // ── Game: Memory Match ───────────────────────────────────────
  function gameMemory(ctx) {
    var EMO = ['🎮', '🚀', '⭐', '🔥', '🎯', '💎', '👾', '🏆'];
    var deck = EMO.concat(EMO).map(function (e, i) { return { e: e, id: i }; });
    for (var i = deck.length - 1; i > 0; i--) { var j = (Math.random() * (i + 1)) | 0; var t = deck[i]; deck[i] = deck[j]; deck[j] = t; }
    var flipped = [], matched = {}, moves = 0, lock = false;
    ctx.foot.innerHTML = '<span class="game-hint">Match all 8 pairs — fewer moves = higher score</span>';
    function render() {
      ctx.stage.innerHTML = '<div class="mem">' + deck.map(function (c, i) {
        var open = matched[i] || flipped.indexOf(i) >= 0;
        return '<button class="mem-card' + (open ? ' open' : '') + (matched[i] ? ' matched' : '') + '" data-i="' + i + '">' + (open ? c.e : '') + '</button>';
      }).join('') + '</div>';
      ctx.stage.querySelectorAll('[data-i]').forEach(function (el) { el.addEventListener('click', function () {
        if (lock) return; var i = +el.getAttribute('data-i'); if (matched[i] || flipped.indexOf(i) >= 0) return;
        flipped.push(i); render();
        if (flipped.length === 2) {
          moves++; lock = true;
          var a = flipped[0], c = flipped[1];
          if (deck[a].e === deck[c].e) { matched[a] = matched[c] = true; flipped = []; lock = false; render();
            if (Object.keys(matched).length === deck.length) { var score = Math.max(60, 800 - moves * 30); ctx.setScore(score); setTimeout(function () { ctx.over(score); }, 500); } }
          else { setTimeout(function () { flipped = []; lock = false; render(); }, 750); }
        }
      }); });
    }
    render();
  }

  // ── Game: Number Guesser ─────────────────────────────────────
  function gameGuesser(ctx) {
    var target = 1 + ((Math.random() * 100) | 0), tries = 0, max = 10;
    ctx.foot.innerHTML = '<span class="game-hint">I picked 1–100. Guess it in ' + max + ' tries.</span>';

        if (tries >= max) { render('Out of tries — it was ' + target + '.', 'bad'); ctx.setScore(0); setTimeout(function () { ctx.over(0); }, 1100); return; }
        render(v < target ? '↑ Higher than ' + v : '↓ Lower than ' + v, v < target ? '' : '');

  document.getElementById('logout').addEventListener('click', function () {
    var r = tok();
    if (r) { fetch(API + '/accounts/logout/', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + r }, body: JSON.stringify({ refresh: localStorage.getItem('tcs_refresh') || '' }) }).catch(function () {}); }
    clearSession(); window.snack('Signed out', 'ok', 1000);
    setTimeout(function () { location.href = 'auth.html'; }, 600);
  });

  // Notifications
  var notifPanel = document.getElementById('notifPanel');
  document.getElementById('notifBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    var open = notifPanel.classList.toggle('open');
    if (open) loadNotifs();
  });
  document.addEventListener('click', function (e) { if (!notifPanel.contains(e.target)) notifPanel.classList.remove('open'); });
  var NOTIF = { items: [], seg: 'today' };
  var NOTIF_GLYPH = {
    game_request: ['🎮', '#F7971E'], game_request_accepted: ['🎮', '#F7971E'],
    chat_message: ['💬', '#6DD5FA'], chat_request: ['💬', '#6DD5FA'], request_accepted: ['💬', '#6DD5FA'], request_declined: ['💬', '#6DD5FA'],
    group_message: ['👥', '#10B981'], group_add: ['👥', '#10B981'], study_group_invite: ['👥', '#10B981'],
    group_material: ['📚', '#6366F1'], study_buddy_request: ['🤝', '#10B981'],
    follow: ['➕', '#EC4899'], follow_request: ['➕', '#EC4899'],
    like: ['❤️', '#FF5858'], comment: ['💬', '#6366F1'], mention: ['📌', '#8E54E9'],
    announcement: ['📢', '#8E54E9'], quiz_published: ['❓', '#F59E0B'], emergency: ['🚨', '#FF5858'],
    suggestion: ['💡', '#4F46E5'], wellbeing: ['💗', '#0EA5A4'],
    event_reminder: ['📅', '#F59E0B'], club_event: ['📅', '#F59E0B'],
    highlight: ['✨', '#8E54E9'], birthday: ['🎂', '#EC4899']
  };
  function notifGlyph(t) { return NOTIF_GLYPH[t] || ['🔔', '#6DD5FA']; }
  function notifBucket(iso) {
    var d = new Date(iso); if (isNaN(d)) return 'earlier';
    var now = new Date(), t = new Date(d.getFullYear(), d.getMonth(), d.getDate()), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var diff = Math.round((today - t) / 86400000);
    return diff <= 0 ? 'today' : (diff === 1 ? 'yesterday' : 'earlier');
  }
  function loadNotifs() {
    var panel = document.getElementById('notifPanel');
    panel.innerHTML =
      '<div class="notif-head"><h3>Notifications</h3><button class="notif-clear" id="notifClear">Clear all</button></div>' +
      '<div class="notif-tabs" id="notifTabs">' + [['today', 'Today'], ['yesterday', 'Yesterday'], ['earlier', 'Earlier']].map(function (s) { return '<button class="notif-tab' + (NOTIF.seg === s[0] ? ' active' : '') + '" data-ns="' + s[0] + '">' + s[1] + '</button>'; }).join('') + '</div>' +
      '<div id="notifList"><div class="loading" style="padding:24px"><div class="spin"></div></div></div>';
    document.getElementById('notifTabs').addEventListener('click', function (e) { var b = e.target.closest('[data-ns]'); if (!b) return; NOTIF.seg = b.getAttribute('data-ns'); this.querySelectorAll('.notif-tab').forEach(function (x) { x.classList.toggle('active', x.getAttribute('data-ns') === NOTIF.seg); }); drawNotifs(); });
    document.getElementById('notifClear').addEventListener('click', function () { fetch(API + '/notifications/clear/', { method: 'POST', headers: { 'Authorization': 'Bearer ' + tok() } }).then(function () { NOTIF.items = []; drawNotifs(); loadNotifCount(); window.snack('Notifications cleared', 'ok', 1200); }).catch(function () {}); });
    authFetch('/notifications/?page=1').then(function (r) {
      if (!r.ok) { var l = document.getElementById('notifList'); if (l) l.innerHTML = '<div class="notif-empty">' + esc((r.d && r.d.detail) || 'Couldn’t load notifications.') + '</div>'; return; }
      NOTIF.items = listOf(r.d);
      var buckets = { today: 0, yesterday: 0, earlier: 0 };
      NOTIF.items.forEach(function (x) { buckets[notifBucket(x.created_at)]++; });
      if (!buckets[NOTIF.seg]) { NOTIF.seg = buckets.today ? 'today' : (buckets.yesterday ? 'yesterday' : 'earlier'); document.querySelectorAll('#notifTabs .notif-tab').forEach(function (x) { x.classList.toggle('active', x.getAttribute('data-ns') === NOTIF.seg); }); }
      drawNotifs();
      fetch(API + '/notifications/mark-all-read/', { method: 'POST', headers: { 'Authorization': 'Bearer ' + tok() } }).then(function () { var dot = document.getElementById('notifDot'); if (dot) dot.classList.remove('show'); }).catch(function () {});
    }).catch(function () { var l = document.getElementById('notifList'); if (l) l.innerHTML = '<div class="notif-empty">Couldn’t load notifications.</div>'; });
  }
  function drawNotifs() {
    var list = document.getElementById('notifList'); if (!list) return;
    var items = NOTIF.items.filter(function (x) { return notifBucket(x.created_at) === NOTIF.seg; });
    if (!items.length) { list.innerHTML = '<div class="notif-empty">' + (NOTIF.seg === 'today' ? 'You’re all caught up 🎉' : NOTIF.seg === 'yesterday' ? 'Nothing from yesterday' : 'Nothing earlier') + '</div>'; return; }
    list.innerHTML = items.map(function (x) {
      var gl = notifGlyph(x.notif_type); var unread = !x.is_read;
      var icon = x.actor_avatar ? avatar(x.actor_avatar, x.actor_name || '', 'notif-avc') : '<span class="notif-ic" style="background:' + gl[1] + '22;color:' + gl[1] + '">' + gl[0] + '</span>';
      return '<div class="notif-item' + (unread ? ' unread' : '') + '">' + icon +
        '<div class="notif-body"><div class="t">' + esc(x.title || 'Notification') + '</div>' +
        (x.body ? '<div class="b">' + esc(x.body) + '</div>' : '') +
        '<div class="notif-time">' + esc(timeAgo(x.created_at)) + '</div></div>' +
        (unread ? '<span class="notif-udot"></span>' : '') + '</div>';
    }).join('');
  }
  function loadNotifCount() {
    authFetch('/notifications/unread-count/').then(function (r) {
      if (!r.ok) return;
      var c = (r.d && (r.d.count != null ? r.d.count : r.d.unread)) || 0;
      var dot = document.getElementById('notifDot');
      if (c > 0) { dot.textContent = c > 99 ? '99+' : c; dot.classList.add('show'); } else { dot.classList.remove('show'); }
    }).catch(function () {});
  }

  // Boot
  // ── Theme (light / dark) ─────────────────────────────────────
  var SUN_IC = '<svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5a1 1 0 0 1 1 1v1.5a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1zm0 16a1 1 0 0 1 1 1V20a1 1 0 1 1-2 0v-1a1 1 0 0 1 1-1zM4.22 4.22a1 1 0 0 1 1.42 0l1 1A1 1 0 0 1 5.2 6.64l-1-1a1 1 0 0 1 0-1.42zm13.16 13.16a1 1 0 0 1 1.42 0l1 1a1 1 0 0 1-1.42 1.42l-1-1a1 1 0 0 1 0-1.42zM2 12a1 1 0 0 1 1-1h1.5a1 1 0 1 1 0 2H3a1 1 0 0 1-1-1zm17.5 0a1 1 0 0 1 1-1H22a1 1 0 1 1 0 2h-1.5a1 1 0 0 1-1-1zM4.22 19.78a1 1 0 0 1 0-1.42l1-1a1 1 0 1 1 1.42 1.42l-1 1a1 1 0 0 1-1.42 0zM17.38 6.64a1 1 0 0 1 0-1.42l1-1a1 1 0 1 1 1.42 1.42l-1 1a1 1 0 0 1-1.42 0z"/></svg>';
  var MOON_IC = '<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
    try { localStorage.setItem('tcs_theme', t); } catch (e) {}
    var ic = document.getElementById('themeIc'); if (ic) ic.innerHTML = (t === 'light' ? MOON_IC : SUN_IC);
    var mt = document.querySelector('meta[name="theme-color"]'); if (mt) mt.setAttribute('content', t === 'light' ? '#EDEFF6' : '#0D0D1A');
  }
  (function () { var th = 'dark'; try { th = localStorage.getItem('tcs_theme') || 'dark'; } catch (e) {} applyTheme(th); })();
  document.getElementById('themeBtn').addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    applyTheme(cur === 'light' ? 'dark' : 'light');
  });

  var start = 'home'; try { start = localStorage.getItem('tcs_tab') || 'home'; } catch (e) {}
  if (start === 'arcade') { document.getElementById('arcadeBtn').classList.add('active'); renderArcade(); } else setTab(start);
  loadNotifCount();
</script>
</body>
</html>
