<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Student Hub · TCS</title>
<meta name="theme-color" content="#0D0D1A" />
<link rel="stylesheet" href="assets/onboarding.css" />
<script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.14/dist/dotlottie-wc.js" type="module"></script>
<style>
  body { overflow: hidden; }
  .app { position: fixed; inset: 0; z-index: 3; display: flex; }

  /* ── Sidebar ─────────────────────────────────────────────────── */
  .side {
    width: 264px; flex: 0 0 auto; height: 100%;
    background: rgba(16,15,28,0.72); border-right: 1px solid var(--hair);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    display: flex; flex-direction: column;
    padding: 20px 16px max(env(safe-area-inset-bottom), 16px);
  }
  .side-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 4px 6px; }
  .brand-title { font-family: 'Alfa', serif; font-size: 26px; line-height: 1;
    background: linear-gradient(90deg, var(--g1), var(--g2), var(--g3), var(--g4));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .brand-sub { font-family: 'Momo', sans-serif; font-size: 12px; color: var(--sub); margin-top: 4px; letter-spacing: 0.4px; }
  .notif-btn { position: relative; width: 40px; height: 40px; flex: 0 0 auto; border-radius: 13px; cursor: pointer;
    background: var(--glass-2); border: 1px solid var(--hair); color: var(--ink);
    display: grid; place-items: center; transition: background 0.15s ease, border-color 0.15s ease; }
  .notif-btn:hover { background: rgba(255,255,255,0.14); border-color: var(--hair-2); }
  .notif-btn svg { width: 20px; height: 20px; fill: currentColor; }
  .notif-btn .dot { position: absolute; top: 7px; right: 8px; min-width: 16px; height: 16px; padding: 0 4px;
    border-radius: 8px; background: var(--g4); color: #fff; font-family: 'Arch', sans-serif; font-weight: 700;
    font-size: 9.5px; display: none; align-items: center; justify-content: center; border: 2px solid #14121f; }
  .notif-btn .dot.show { display: flex; }

  .grad-divider { height: 2px; margin: 16px 6px 14px; border-radius: 2px;
    background: linear-gradient(90deg, var(--g1), var(--g2), var(--g3), var(--g4)); opacity: 0.9; }

  .nav { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
  .nav-item { display: flex; align-items: center; gap: 13px; width: 100%; padding: 12px 14px; border: 0; cursor: pointer;
    background: none; border-radius: 14px; color: var(--sub); text-align: left;
    font-family: 'Arch', sans-serif; font-weight: 700; font-size: 14px; transition: background 0.15s ease, color 0.15s ease; }
  .nav-item svg { width: 21px; height: 21px; fill: currentColor; flex: 0 0 auto; }
  .nav-item:hover { background: var(--glass); color: var(--ink); }
  .nav-item.active { color: #fff; background: linear-gradient(90deg, rgba(142,84,233,0.28), rgba(109,213,250,0.12));
    box-shadow: inset 3px 0 0 var(--g1); }

  .side-bottom { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--hair); display: flex; flex-direction: column; gap: 4px; }
  .nav-item.arcade { color: #F5C36B; }
  .nav-item.arcade:hover { background: rgba(247,151,30,0.12); }
  .nav-item.logout { color: #FF8A9B; }
  .nav-item.logout:hover { background: rgba(228,68,90,0.12); }

  /* ── Content ─────────────────────────────────────────────────── */
  .content { flex: 1; height: 100%; overflow-y: auto; }
  .inner { max-width: none; margin: 0; padding: 30px 32px 60px; }
  .view-head { margin-bottom: 20px; }
  .view-head h1 { font-family: 'Alfa', serif; font-size: 27px; line-height: 1.1; }
  .view-head p { font-family: 'Momo', sans-serif; font-size: 13px; color: var(--sub); margin-top: 6px; }

  .card { padding: 16px; margin-bottom: 12px; }
  .row { display: flex; gap: 12px; }
  .av { width: 44px; height: 44px; border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--g2), var(--g1)); font-family: 'Alfa', serif; font-size: 15px; color: #fff; overflow: hidden; }
  .av img { width: 100%; height: 100%; object-fit: cover; }
  .muted { color: var(--sub); } .faint { color: var(--faint); }
  .chip { display: inline-block; font-family: 'Arch', sans-serif; font-weight: 700; font-size: 10.5px; letter-spacing: 0.4px;
    padding: 3px 9px; border-radius: 999px; text-transform: uppercase; }
  .pillbtn { border: 0; cursor: pointer; border-radius: 12px; padding: 8px 16px; color: #fff;
    font-family: 'Arch', sans-serif; font-weight: 700; font-size: 12.5px;
    background: linear-gradient(90deg, var(--g2), var(--g1)); }
  .pillbtn.ghost2 { background: var(--glass-2); border: 1px solid var(--hair); color: var(--ink); }

  .empty, .loading { text-align: center; padding: 50px 20px; font-family: 'Momo', sans-serif; color: var(--faint); font-size: 13.5px; }
  .spin { width: 26px; height: 26px; border: 3px solid rgba(255,255,255,0.18); border-top-color: var(--g1);
    border-radius: 50%; margin: 0 auto 12px; animation: rot 0.8s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }

  /* Notifications dropdown */
  .notif-panel { position: fixed; top: 66px; left: 16px; width: 300px; max-height: 60vh; overflow-y: auto;
    z-index: 40; padding: 8px; display: none; }
  .notif-panel.open { display: block; }
  .notif-panel h3 { font-family: 'Arch', sans-serif; font-size: 13px; padding: 8px 10px; color: var(--ink); }
  .notif-item { padding: 10px; border-radius: 12px; }
  .notif-item + .notif-item { margin-top: 2px; }
  .notif-item:hover { background: var(--glass); }
  .notif-item .t { font-family: 'Arch', sans-serif; font-weight: 700; font-size: 12.5px; color: var(--ink); }
  .notif-item .b { font-family: 'Momo', sans-serif; font-size: 11.5px; color: var(--sub); margin-top: 3px; line-height: 1.4; }

  .grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }

  /* Profile */
  .prof-hero { display: flex; align-items: center; gap: 18px; padding: 22px; }
  .prof-hero .big { width: 84px; height: 84px; font-size: 30px; border-radius: 26px; }
  .prof-hero .big.round { border-radius: 50%; }
  .prof-stats { display: grid; grid-template-columns: repeat(4,1fr); padding: 4px; margin: 12px 0; }
  .prof-stats .s { text-align: center; padding: 14px 4px; }
  .prof-stats .s + .s { border-left: 1px solid var(--hair); }
  .prof-stats .n { font-family: 'Alfa', serif; font-size: 19px; }
  .prof-stats .l { font-family: 'Momo', sans-serif; font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.4px; margin-top: 3px; }

  /* Mobile: collapse sidebar to an icon rail */
  @media (max-width: 780px) {
    .side { width: 74px; padding: 16px 10px; }
    .brand-sub, .nav-item span, .brand-title { display: none; }
    .side-head { justify-content: center; }
    .notif-btn { width: 44px; height: 44px; }
    .grad-divider { margin: 14px 2px; }
    .nav-item { justify-content: center; padding: 13px 0; }
    .inner { padding: 22px 16px 60px; }
  }

  /* ── HOME tab ─────────────────────────────────────────────────── */
  .home-greet { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
  .hg-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .hg-left dotlottie-wc { width: 46px; height: 46px; flex: 0 0 auto; }
  .hg-text { font-family: 'Alfa', serif; font-size: clamp(19px, 4.5vw, 23px); white-space: nowrap; }
  .hg-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; flex: 0 0 auto; flex-wrap: wrap; }
  .sugg-btn, .dale-btn { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    border-radius: 13px; font-family: 'Arch', sans-serif; font-weight: 700; font-size: 12.5px; transition: background 0.15s ease; }
  .sugg-btn { border: 1px solid rgba(247,151,30,0.4); background: rgba(247,151,30,0.12); color: #F7B955; padding: 9px 14px; }
  .sugg-btn:hover { background: rgba(247,151,30,0.2); }
  .sugg-btn svg { width: 16px; height: 16px; fill: currentColor; }
  .dale-btn { border: 1px solid rgba(142,84,233,0.45); background: rgba(142,84,233,0.16); color: #C6B3F5; padding: 5px 14px 5px 7px; }
  .dale-btn:hover { background: rgba(142,84,233,0.26); }
  .dale-btn dotlottie-wc { width: 30px; height: 30px; flex: 0 0 auto; }

  .home-actions { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .icon-btn { width: 48px; height: 48px; flex: 0 0 auto; border-radius: 14px; cursor: pointer; display: grid; place-items: center;
    border: 1px solid var(--hair); color: #fff; }
  .addpost-btn { background: linear-gradient(135deg, var(--g2), var(--g1)); border: 0; box-shadow: 0 8px 20px rgba(142,84,233,0.4); }
  .addpost-btn svg { width: 24px; height: 24px; fill: #fff; }
  .refresh-btn { background: var(--glass-2); color: var(--sub); }
  .refresh-btn:hover { background: rgba(255,255,255,0.14); color: var(--ink); }
  .refresh-btn svg { width: 21px; height: 21px; fill: currentColor; transition: transform 0.2s ease; }
  .refresh-btn.spinning svg { animation: rot 0.7s linear infinite; }
  .search-box { flex: 1; min-width: 0; height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 14px;
    border-radius: 14px; background: rgba(255,255,255,0.05); border: 1.5px solid var(--hair); transition: border-color 0.15s ease; }
  .search-box:focus-within { border-color: var(--g2); }
  .search-box svg { width: 19px; height: 19px; fill: var(--faint); flex: 0 0 auto; }
  .search-box input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--ink);
    font-family: 'Momo', sans-serif; font-size: 14px; }
  .search-box input::placeholder { color: var(--faint); }

  .feed-label { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .feed-label .eyebrow { font-family: 'Arch', sans-serif; font-weight: 700; font-size: 10px; letter-spacing: 1.5px; color: #B79BF3; }
  .feed-label .feed-title { font-family: 'Alfa', serif; font-size: 21px; margin-top: 2px; }
  .feed-label .post-count { font-family: 'Momo', sans-serif; font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums; }

  .feed-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; scrollbar-width: none; }
  .feed-tabs::-webkit-scrollbar { display: none; }
  .feed-tab { flex: 0 0 auto; cursor: pointer; border-radius: 20px; padding: 9px 18px; border: 1px solid var(--hair);
    background: var(--glass); color: var(--sub); font-family: 'Arch', sans-serif; font-weight: 700; font-size: 13px;
    transition: transform 0.2s cubic-bezier(0.22,0.61,0.36,1), background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease; }
  .feed-tab:hover { color: var(--ink); }
  .feed-tab.active { color: #fff; border-color: transparent; background: linear-gradient(90deg, var(--g2), var(--g1));
    box-shadow: 0 8px 18px rgba(142,84,233,0.35); }

  /* Post card — vertical list, full width, gradient border */
  .post { position: relative; padding: 0; margin-bottom: 14px; overflow: hidden; border-radius: 20px;
    background: rgba(255,255,255,0.05); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    box-shadow: 0 16px 40px rgba(0,0,0,0.3); }
  .post::before { content: ''; position: absolute; inset: 0; border-radius: 20px; padding: 1.6px; pointer-events: none;
    background: linear-gradient(135deg, var(--g1), var(--g2), var(--g3), var(--g4));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; }

  /* Google-Photos-style image grid (Events posters / Club posts) */
  .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 6px; }
  .photo { position: relative; aspect-ratio: 1; border: 0; cursor: pointer; border-radius: 12px; overflow: hidden;
    background-size: cover; background-position: center; background-color: var(--glass-2);
    transition: transform 0.15s ease; }
  .photo:hover { transform: scale(0.98); }
  .photo .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 24px 11px 9px; text-align: left;
    background: linear-gradient(transparent, rgba(0,0,0,0.82)); color: #fff; font-family: 'Arch', sans-serif;
    font-weight: 700; font-size: 11.5px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .photo .txtbody { position: absolute; inset: 0; padding: 13px; font-family: 'Momo', sans-serif; font-size: 12px;
    color: #fff; line-height: 1.5; overflow: hidden; text-align: left; }
  .post-top { display: flex; align-items: center; gap: 12px; padding: 15px 16px 0; }
  .post-av { width: 46px; height: 46px; border-radius: 50%; padding: 2px; flex: 0 0 auto;
    background: linear-gradient(135deg, var(--g2), var(--g1)); }
  .post-av .av { width: 100%; height: 100%; border: 2px solid #14121f; }
  .post-meta { min-width: 0; }
  .post-meta .pn { font-family: 'Arch', sans-serif; font-weight: 700; font-size: 14.5px; }
  .post-meta .ph { font-family: 'Momo', sans-serif; font-size: 11.5px; color: var(--faint); margin-top: 2px; }
  .post-text { padding: 12px 16px 0; font-family: 'Momo', sans-serif; font-size: 14px; line-height: 1.55; color: var(--ink); white-space: pre-wrap; word-break: break-word; }
  .post-media { margin: 12px 0 0; }
  .post-media img { display: block; width: 100%; max-height: 420px; object-fit: cover; }
  .post-actions { display: flex; gap: 8px; padding: 12px 14px; }
  .pa { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; border: 0; border-radius: 11px;
    padding: 8px 13px; background: var(--glass-2); color: var(--sub); font-family: 'Arch', sans-serif; font-weight: 700; font-size: 12.5px;
    transition: background 0.15s ease, color 0.15s ease; }
  .pa:hover { background: rgba(255,255,255,0.12); color: var(--ink); }
  .pa.like:hover { color: #FF6B7A; } .pa svg { width: 16px; height: 16px; fill: currentColor; }
  .pa.share { margin-left: auto; }

  /* ── Study Hub tab ────────────────────────────────────────────── */
  .lockin-row { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
  .lockin-left { display: flex; align-items: center; gap: 11px; }
  .grad-icn { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; flex: 0 0 auto;
    background: linear-gradient(135deg, var(--g2), var(--g1)); box-shadow: 0 10px 22px rgba(142,84,233,0.35); }
  .grad-icn svg { width: 24px; height: 24px; fill: #fff; }
  .lockin-title { font-family: 'Alfa', serif; font-size: clamp(20px, 5vw, 25px); }
  .lockin-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .lib-btn { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; border-radius: 13px; padding: 9px 14px;
    border: 1px solid rgba(109,213,250,0.4); background: rgba(109,213,250,0.14); color: #8BD5F5;
    font-family: 'Arch', sans-serif; font-weight: 700; font-size: 12.5px; transition: background 0.15s ease; }
  .lib-btn:hover { background: rgba(109,213,250,0.24); }
  .lib-btn svg { width: 16px; height: 16px; fill: currentColor; }

  .sh-actions { display: flex; align-items: center; gap: 10px; margin: 16px 0 18px; }
  .sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin: 4px 0 14px; }
  .sec-head .sh-title { font-family: 'Alfa', serif; font-size: 19px; }
  .sec-head .eyebrow { font-family: 'Arch', sans-serif; font-weight: 700; font-size: 10px; letter-spacing: 1.5px; color: #B79BF3; display: block; margin-bottom: 2px; }
  .h-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 8px; scrollbar-width: none; }
  .h-scroll::-webkit-scrollbar { display: none; }
  .online-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #38EF7D; box-shadow: 0 0 6px #38EF7D; margin-right: 5px; }

  /* Group tile */
  .group-card { display: flex; flex-direction: column; margin: 0; padding: 0; overflow: hidden; border-radius: 18px; }
  .h-scroll .group-card { flex: 0 0 auto; width: 216px; }
  .grid2 .group-card { width: auto; }
  .gc-banner { height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; }
  .gc-badge { width: 48px; height: 48px; border-radius: 15px; display: grid; place-items: center; font-size: 26px;
    background: rgba(0,0,0,0.24); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25); }
  .gc-live { font-family: 'Arch', sans-serif; font-weight: 700; font-size: 10px; color: #fff; background: rgba(0,0,0,0.3);
    padding: 4px 8px; border-radius: 999px; display: inline-flex; align-items: center; gap: 5px; }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #38EF7D; box-shadow: 0 0 6px #38EF7D; }
  .gc-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
  .gc-name { font-family: 'Arch', sans-serif; font-weight: 700; font-size: 14.5px; line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .gc-sub { font-family: 'Momo', sans-serif; font-size: 11px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gc-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 10px; }
  .gc-members { font-family: 'Momo', sans-serif; font-size: 11.5px; color: var(--faint); display: inline-flex; align-items: center; gap: 5px; }
  .gc-members svg { width: 14px; height: 14px; fill: var(--faint); }
  .gc-foot .pillbtn { padding: 7px 14px; font-size: 12px; }

  /* Study buddy tile */
  .buddy-card { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 18px 14px 16px; margin: 0; }
  .buddy-av-wrap { position: relative; }
  .buddy-av-wrap .av { width: 62px; height: 62px; font-size: 21px; border: 2px solid rgba(56,239,125,0.65); }
  .buddy-online { position: absolute; right: 1px; bottom: 1px; width: 15px; height: 15px; border-radius: 50%;
    background: #38EF7D; border: 2.5px solid #14121f; box-shadow: 0 0 7px #38EF7D; }
  .buddy-name { font-family: 'Arch', sans-serif; font-weight: 700; font-size: 14px; margin-top: 11px; }
  .buddy-subs { font-family: 'Momo', sans-serif; font-size: 11px; color: var(--sub); margin-top: 4px; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .buddy-card .pillbtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; width: 100%; margin-top: 12px; }
  .buddy-card .pillbtn svg { width: 14px; height: 14px; fill: #fff; }

  /* ── Messages tab (master-detail) ─────────────────────────────── */
  .msg-split { position: relative; display: flex; height: calc(100dvh - 96px); min-height: 460px;
    border-radius: 22px; overflow: hidden; background: rgba(255,255,255,0.03); }
  .msg-split::before { content: ''; position: absolute; inset: 0; border-radius: 22px; padding: 3px; pointer-events: none; z-index: 6;
    background: linear-gradient(135deg, var(--g1), var(--g2), var(--g3), var(--g4));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; }
  .msg-list { width: 322px; flex: 0 0 auto; display: flex; flex-direction: column; border-right: 1px solid var(--hair); }
  .msg-list-head { padding: 16px 14px 12px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid var(--hair); }
  .msg-title-row { display: flex; align-items: center; justify-content: space-between; }
  .msg-title-row h1 { font-family: 'Alfa', serif; font-size: 22px; }
  .msg-tabs { display: flex; gap: 6px; }
  .msg-tabs .feed-tab { padding: 7px 14px; font-size: 12px; }
  .msg-rows { flex: 1; overflow-y: auto; padding: 8px; }
  .chat-row { display: flex; align-items: center; gap: 11px; padding: 10px; border-radius: 14px; cursor: pointer; transition: background 0.12s ease; }
  .chat-row:hover { background: var(--glass); }
  .chat-row.active { background: var(--glass-2); box-shadow: inset 3px 0 0 var(--g1); }
  .chat-row .cr-name { font-family: 'Arch', sans-serif; font-weight: 700; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-row .cr-last { font-family: 'Momo', sans-serif; font-size: 11.5px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .chat-row .cr-time { font-family: 'Momo', sans-serif; font-size: 10.5px; color: var(--faint); flex: 0 0 auto; }

  .msg-detail { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .conv-head { padding: 13px 16px; border-bottom: 1px solid var(--hair); display: flex; align-items: center; gap: 12px; flex: 0 0 auto; }
  .conv-head .av { width: 40px; height: 40px; font-size: 15px; }
  .conv-back { display: none; padding: 8px 10px; }
  .conv-close { flex: 0 0 auto; width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--hair); cursor: pointer;
    background: rgba(255,255,255,0.05); display: grid; place-items: center; color: var(--sub); transition: background .15s ease, color .15s ease; }

  var API = 'https://tcs-nsw.duckdns.org/api';

  function clearSession() { ['tcs_access','tcs_refresh','tcs_user'].forEach(function (k) { try { localStorage.removeItem(k); } catch (e) {} }); }
  if (!tok()) { location.replace('auth.html'); }

  function refreshToken() {
    var r; try { r = localStorage.getItem('tcs_refresh'); } catch (e) {}
    if (!r) return Promise.resolve(false);
    return fetch(API + '/accounts/token/refresh/', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh: r }) })
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (d) { if (d && d.access) { localStorage.setItem('tcs_access', d.access); if (d.refresh) localStorage.setItem('tcs_refresh', d.refresh); return true; } return false; })

        // Tolerate non-JSON responses (HTML 404/500/502) so callers get a

  function setPostCount(n) {
    var el = document.getElementById('postCount'); if (!el) return;
    var noun = HOME.kind === 'events' ? 'events' : 'posts';
    el.textContent = n ? (n + ' ' + noun) : '';
  }
  function loadFeedTab() {
    var body = document.getElementById('feedBody');
    body.innerHTML = '<div class="loading"><div class="spin"></div>Loading…</div>';
    var tab = HOME.tab, path;
    if (tab === 'all') { path = '/posts/feed/?type=home&page=1'; HOME.kind = 'posts'; }
    else if (tab === 'following') { path = '/posts/feed/?type=following&page=1'; HOME.kind = 'posts'; }
    else if (tab === 'events') { path = '/clubs/events-feed/?page=1'; HOME.kind = 'events'; }
    else { path = '/posts/feed/?type=club_posts&page=1'; HOME.kind = 'clubposts'; }
    authFetch(path).then(function (r) {
      var rb = document.getElementById('refreshBtn'); if (rb) rb.classList.remove('spinning');
      if (!r.ok) { HOME.items = []; setPostCount(0); body.innerHTML = empty((r.d && r.d.detail) || 'Couldn’t load the feed.'); return; }
      HOME.items = listOf(r.d);
      renderFeedItems(HOME.items);
    }).catch(function () {
      var rb = document.getElementById('refreshBtn'); if (rb) rb.classList.remove('spinning');
      body.innerHTML = empty('Couldn’t load the feed.'); window.snack('Couldn’t load the feed', 'error');
    });
  }
  function renderFeedItems(items) {
    var body = document.getElementById('feedBody'); if (!body) return;
    setPostCount(items.length);
    if (!items.length) { body.innerHTML = empty('Nothing here yet.'); return; }
    if (HOME.kind === 'posts') { body.innerHTML = items.map(postCard).join(''); wirePostActions(body); }
    else if (HOME.kind === 'events') { body.innerHTML = '<div class="photo-grid">' + items.map(eventPhoto).join('') + '</div>'; wirePhotos(body, 'The event page is coming to the web soon'); }
    else { body.innerHTML = '<div class="photo-grid">' + items.map(clubPostPhoto).join('') + '</div>'; wirePhotos(body, 'Post view is coming to the web soon'); }
  }
  function filterFeed(q) {
    q = (q || '').toLowerCase().trim();
    if (!q) { renderFeedItems(HOME.items); return; }
    renderFeedItems(HOME.items.filter(function (it) { return JSON.stringify(it).toLowerCase().indexOf(q) >= 0; }));
  }
  function postCard(p) {
    var a = p.author || p.user || {};

    var handle = a.user_id || a.username || 'user';
    var text = p.content || p.text || p.caption || '';

      '<div class="post-top"><div class="post-av">' + avatar(a.avatar_url, name) + '</div>' +

      (text ? '<div class="post-text">' + esc(text) + '</div>' : '') +
      (img ? '<div class="post-media"><img src="' + esc(img) + '" alt="" /></div>' : '') +
      '<div class="post-actions">' +
        '<button class="pa like" data-act><svg viewBox="0 0 24 24"><path d="M12 21l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.18z"/></svg>' + num(p.like_count || p.likes_count) + '</button>' +
        '<button class="pa" data-act><svg viewBox="0 0 24 24"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/></svg>' + num(p.comment_count || p.comments_count) + '</button>' +
        '<button class="pa share" data-act><svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81a3 3 0 1 0-3-3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9a3 3 0 1 0 0 6c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65a2.92 2.92 0 1 0 2.92-2.92z"/></svg></button>' +
      '</div></article>';
  }
  function wirePostActions(root) { root.querySelectorAll('.pa[data-act]').forEach(function (b) { b.addEventListener('click', function () { window.snack('Post actions are coming to the web soon', 'info'); }); }); }
  function wireClubActions(root) { root.querySelectorAll('[data-club]').forEach(function (b) { b.addEventListener('click', function () { window.snack('Joining clubs is coming to the web soon', 'info'); }); }); }
  // Google-Photos-style tiles for the Events (posters) and Clubs (posts) feeds
  var GRADS4 = ['linear-gradient(135deg,#4FC3F7,#0288D1)', 'linear-gradient(135deg,#F7971E,#FF5858)', 'linear-gradient(135deg,#11998E,#38EF7D)', 'linear-gradient(135deg,#8E54E9,#EC4899)'];
  function eventPhoto(e, i) {

  function clubPostPhoto(p, i) {
    var a = p.author || p.user || {};

    var m = (p.media && p.media[0]) || null;
    var img = m && (m.thumbnail_url || m.url);

  function wirePhotos(root, msg) { root.querySelectorAll('[data-photo]').forEach(function (b) { b.addEventListener('click', function () { window.snack(msg, 'info'); }); }); }
  function clubCard(c) {
    var members = num(c.member_count || c.members_count || (c.members && c.members.length));
    var cat = c.category || c.type || 'Club';

  // ── Modal + Suggestion Box ───────────────────────────────────

  function openCreatePost() {
    openModal(
      '<div class="modal-head"><div class="mi" style="background:linear-gradient(135deg,var(--g2),var(--g1))"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg></div>' +
      '<h2>New post</h2><button class="ghost x" id="mClose" style="padding:8px 10px"><svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button></div>' +
      '<p class="sub">Share something with campus.</p>' +
      '<textarea id="cpText" rows="5" placeholder="What’s on your mind?"></textarea>' +
      '<button class="btn" id="cpSubmit" style="margin-top:18px"><span class="spinner" style="width:18px;height:18px;border:2.5px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;display:none"></span><span>Post</span></button>'
    );
    document.getElementById('mClose').addEventListener('click', closeModal);
    document.getElementById('cpSubmit').addEventListener('click', function () {
      var text = document.getElementById('cpText').value.trim();
      if (!text) { window.snack('Write something first.', 'error'); return; }
      var btn = this; btn.disabled = true; btn.querySelector('.spinner').style.display = 'inline-block'; btn.querySelector('span:last-child').textContent = 'Posting…';
      fetch(API + '/posts/', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok(), 'Accept': 'application/json' },
        body: JSON.stringify({ post_type: 'post', content: text, visibility: 'public' }) })
        .then(function (res) { return res.json().then(function (d) { return { ok: res.ok, d: d }; }); })
        .then(function (res) {
          if (!res.ok) { window.snack((res.d && (res.d.detail || res.d.error)) || 'Couldn’t post — please try again.', 'error'); btn.disabled = false; btn.querySelector('.spinner').style.display = 'none'; btn.querySelector('span:last-child').textContent = 'Post'; return; }
          closeModal(); window.snack('Posted!', 'ok');
          if ((HOME.tab === 'all' || HOME.tab === 'following')) { var s = document.getElementById('feedSearch'); if (s) s.value = ''; loadFeedTab(); }
        })
        .catch(function () { window.snack('Couldn’t reach the server.', 'error'); btn.disabled = false; btn.querySelector('.spinner').style.display = 'none'; btn.querySelector('span:last-child').textContent = 'Post'; });
    });

  function openSuggestionBox() {
    openModal(
      '<div class="modal-head"><div class="mi"><svg viewBox="0 0 24 24"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"/></svg></div>' +
      '<h2>Suggestion Box</h2><button class="ghost x" id="mClose" style="padding:8px 10px"><svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button></div>' +
      '<p class="sub">Got an idea to make TCS better? Tell the team.</p>' +
      '<label>Category</label><div class="cat-row" id="catRow"><span class="faint" style="font-size:12px;font-family:Momo">Loading…</span></div>' +
      '<label>Title</label><input id="sgTitle" placeholder="A short summary" maxlength="120" />' +
      '<label>Your suggestion</label><textarea id="sgMsg" rows="4" placeholder="Describe your idea…"></textarea>' +
      '<button class="btn" id="sgSubmit" style="margin-top:18px"><span class="spinner" style="width:18px;height:18px;border:2.5px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;display:none"></span><span>Send suggestion</span></button>'
    );
    document.getElementById('mClose').addEventListener('click', closeModal);
    var sel = { id: '' };
    authFetch('/feedback/categories/').then(function (r) {
      var cats = listOf(r.d); var row = document.getElementById('catRow');
      if (!r.ok || !cats.length) { row.innerHTML = '<span class="faint" style="font-size:12px;font-family:Momo">' + esc((r.d && r.d.detail) || 'No categories') + '</span>'; return; }
      row.innerHTML = cats.map(function (c, i) { return '<button type="button" class="cat' + (i === 0 ? ' sel' : '') + '" data-cat="' + esc(c.id || c.slug || c.value) + '">' + esc(c.label || c.name) + '</button>'; }).join('');
      sel.id = (cats[0].id || cats[0].slug || cats[0].value);
      row.addEventListener('click', function (e) { var b = e.target.closest('[data-cat]'); if (!b) return; sel.id = b.getAttribute('data-cat'); row.querySelectorAll('.cat').forEach(function (x) { x.classList.toggle('sel', x === b); }); });
    }).catch(function () {});
    document.getElementById('sgSubmit').addEventListener('click', function () {
      var title = document.getElementById('sgTitle').value.trim(), msg = document.getElementById('sgMsg').value.trim();
      if (!title || !msg) { window.snack('Add a title and your suggestion.', 'error'); return; }
      var btn = this; btn.disabled = true; btn.querySelector('.spinner').style.display = 'inline-block'; btn.querySelector('span:last-child').textContent = 'Sending…';
      fetch(API + '/feedback/suggest/', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok(), 'Accept': 'application/json' },
        body: JSON.stringify({ title: title, message: msg, category: sel.id }) })
        .then(function (res) { return res.json().then(function (d) { return { ok: res.ok, d: d }; }); })
        .then(function (res) {
          if (!res.ok) { window.snack((res.d && (res.d.detail || res.d.error)) || 'Couldn’t send — please try again.', 'error'); btn.disabled = false; btn.querySelector('.spinner').style.display = 'none'; btn.querySelector('span:last-child').textContent = 'Send suggestion'; return; }
          closeModal(); window.snack('Thanks! Your suggestion was sent.', 'ok');
        })
        .catch(function () { window.snack('Couldn’t reach the server.', 'error'); btn.disabled = false; btn.querySelector('.spinner').style.display = 'none'; btn.querySelector('span:last-child').textContent = 'Send suggestion'; });
    });
  }

  // Same header language as Home: eyebrow + title + live count, then a

  var SEARCH_SVG = '<svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5 1.5-1.5-5-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>';
  var REFRESH_SVG = '<svg viewBox="0 0 24 24"><path d="M17.65 6.35A8 8 0 1 0 19.73 14h-2.08A6 6 0 1 1 12 6a5.9 5.9 0 0 1 4.2 1.8L13 11h7V4z"/></svg>';
  function renderListTab(o) {
    view.innerHTML =
      '<div class="feed-label"><div><div class="eyebrow">' + o.eyebrow + '</div><div class="feed-title">' + esc(o.title) + '</div></div>' +
        '<span class="post-count" id="ltCount"></span></div>' +
      '<div class="home-actions">' + (o.action || '') +
        '<div class="search-box">' + SEARCH_SVG + '<input id="ltSearch" placeholder="' + esc(o.searchPh || 'Search') + '" autocomplete="off" /></div>' +
        '<button class="icon-btn refresh-btn" id="ltRefresh" title="Refresh">' + REFRESH_SVG + '</button>' +
      '</div><div id="ltBody"></div>';
    var state = { items: [] };
    function setCount(n) { var el = document.getElementById('ltCount'); if (el) el.textContent = n ? (n + ' ' + o.noun) : ''; }
    function draw(items) {
      var body = document.getElementById('ltBody'); if (!body) return;
      setCount(items.length);
      if (!items.length) { body.innerHTML = empty('Nothing here yet.'); return; }
      body.innerHTML = o.grid ? '<div class="grid2">' + items.map(o.cardFn).join('') + '</div>' : items.map(o.cardFn).join('');
      if (o.wireFn) o.wireFn(body);
    }
    function load() {
      var body = document.getElementById('ltBody'); body.innerHTML = '<div class="loading"><div class="spin"></div>Loading…</div>';
      authFetch(o.path).then(function (r) {
        var rb = document.getElementById('ltRefresh'); if (rb) rb.classList.remove('spinning');
        if (!r.ok) { state.items = []; setCount(0); body.innerHTML = empty((r.d && r.d.detail) || 'Couldn’t load.'); return; }
        state.items = listOf(r.d); draw(state.items);
      }).catch(function () { var rb = document.getElementById('ltRefresh'); if (rb) rb.classList.remove('spinning'); body.innerHTML = empty('Couldn’t load.'); window.snack('Couldn’t load', 'error'); });
    }
    document.getElementById('ltRefresh').addEventListener('click', function () { this.classList.add('spinning'); load(); });
    document.getElementById('ltSearch').addEventListener('input', function () {
      var q = this.value.toLowerCase().trim();

    });
    if (o.action && o.onAction) { var ab = document.getElementById('ltAction'); if (ab) ab.addEventListener('click', o.onAction); }

  }

  function openCreateGroup() {
    openModal(

      fetch(API + '/groups/', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok(), 'Accept': 'application/json' },

        .then(function (res) { return res.json().then(function (d) { return { ok: res.ok, d: d }; }); })
        .then(function (res) {
          if (!res.ok) { window.snack((res.d && (res.d.detail || res.d.error)) || 'Couldn’t create the group.', 'error'); btn.disabled = false; btn.querySelector('.spinner').style.display = 'none'; btn.querySelector('span:last-child').textContent = 'Create group'; return; }

        })
        .catch(function () { window.snack('Couldn’t reach the server.', 'error'); btn.disabled = false; btn.querySelector('.spinner').style.display = 'none'; btn.querySelector('span:last-child').textContent = 'Create group'; });
    });

  function lastPreview(m) {
    var lm = m.last_message;
    if (typeof lm === 'object' && lm) {
      if (lm.text) return lm.text;
      var t = lm.message_type;
      if (t === 'image' || t === 'gif') return '📷 Photo';
      if (t === 'audio' || t === 'voice') return '🎤 Voice message';
      if (t === 'video') return '🎥 Video';
      if (t === 'file') return '📎 ' + (lm.file_name || 'File');
      return '';
    }
    return m.last_message_text || (typeof lm === 'string' ? lm : '') || '';
  }
  function chatRow(m) {
    var name = roomName(m); var last = lastPreview(m); var unread = num(m.unread_count);
    return '<div class="chat-row' + (MSG.active === m.id ? ' active' : '') + '" data-room="' + esc(m.id) + '">' + avatar(roomAvatar(m), name) +
      '<div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;gap:6px"><span class="cr-name">' + esc(name) + '</span><span class="cr-time">' + esc(timeAgo(m.last_message_at)) + '</span></div>' +
      '<div class="cr-last">' + esc(last || 'No messages yet') + '</div></div>' +
      (unread ? '<span class="chip" style="background:var(--g2);color:#fff">' + unread + '</span>' : '') + '</div>';
  }
  function buddyRow(b) {
    return '<div class="chat-row" data-buddy="' + esc(b.user_id || '') + '">' + avatar(b.avatar_url, b.name) +
      '<div style="flex:1;min-width:0"><div class="cr-name">' + esc(b.name || b.display_name || 'Student') + '</div><div class="cr-last">Tap to start a chat</div></div></div>';
  }
  function drawRows() {
    var rows = document.getElementById('msgRows'); if (!rows) return;
    var q = (document.getElementById('msgSearch').value || '').toLowerCase().trim();
    if (MSG.tab === 'buddies') {
      if (!MSG.buddiesLoaded) {
        rows.innerHTML = '<div class="loading"><div class="spin"></div></div>';
        authFetch('/chat/users/connected/').then(function (r) { MSG.buddies = r.ok ? listOf(r.d) : []; MSG.buddiesLoaded = true; drawRows(); })
          .catch(function () { MSG.buddies = []; MSG.buddiesLoaded = true; drawRows(); });
        return;
      }
      var bl = q ? MSG.buddies.filter(function (b) { return (b.name || b.display_name || '').toLowerCase().indexOf(q) >= 0; }) : MSG.buddies;
      rows.innerHTML = bl.length ? bl.map(buddyRow).join('') : empty('No buddies connected yet.');
      rows.querySelectorAll('[data-buddy]').forEach(function (el) { el.addEventListener('click', function () { startDM(el.getAttribute('data-buddy')); }); });
      return;
    }
    var list = MSG.rooms.filter(function (m) { return MSG.tab === 'bubbles' ? (m.room_type === 'group') : (m.room_type !== 'group'); });
    if (q) list = list.filter(function (m) { return roomName(m).toLowerCase().indexOf(q) >= 0; });
    if (!list.length) { rows.innerHTML = empty('No chats here yet.'); return; }
    rows.innerHTML = list.map(chatRow).join('');
    rows.querySelectorAll('[data-room]').forEach(function (el) { el.addEventListener('click', function () { openConversation(el.getAttribute('data-room')); }); });

  var DBL_TICK = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.6 6.3 8.9 15l-1.4-1.4L16.2 4.9zM22 6.3 13.3 15l-3-3-1.4 1.4 4.4 4.4L23.4 7.7zM1.6 13.6 6 18l1.4-1.4-4.4-4.4z"/></svg>';
  var SGL_TICK = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 20.5 7.5l-1.4-1.4z"/></svg>';
  function tickSvg(status) {
    if (status === 'read') return '<span class="ticks" style="color:#6DD5FA">' + DBL_TICK + '</span>';
    if (status === 'delivered') return '<span class="ticks" style="color:rgba(255,255,255,.7)">' + DBL_TICK + '</span>';
    if (status === 'sent') return '<span class="ticks" style="color:rgba(255,255,255,.7)">' + SGL_TICK + '</span>';
    return '';
  }
  function dayLabel(iso) {
    var d = new Date(iso); if (isNaN(d)) return '';
    var t = new Date(d.getFullYear(), d.getMonth(), d.getDate()), now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var diff = Math.round((today - t) / 86400000);
    if (diff === 0) return 'Today'; if (diff === 1) return 'Yesterday';
    return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }
  function timeHM(iso) { var d = new Date(iso); return isNaN(d) ? '' : d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }); }
  var FILE_SVG = '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm4 18H6V4h7v5h5v11z"/></svg>';
  function mediaHtml(m) {
    var url = esc(m.media_url), t = m.message_type;
    if (t === 'audio' || t === 'voice') return '<div class="bmedia"><audio controls preload="none" src="' + url + '"></audio></div>';
    if (t === 'video') return '<div class="bmedia"><video controls preload="metadata" src="' + url + '"></video></div>';
    if (t === 'file') return '<div class="bmedia"><a class="bfile" href="' + url + '" target="_blank" rel="noopener">' + FILE_SVG + '<span class="fn">' + esc(m.file_name || 'Download file') + '</span></a></div>';
    return '<div class="bmedia"><img src="' + url + '" alt="" /></div>';
  }
  function renderThread(msgs, isGroup) {
    var html = '', lastDay = '', prevSender = null;
    msgs.forEach(function (m) {
      var day = dayLabel(m.created_at);
      if (day && day !== lastDay) { html += '<div class="msg-day">' + esc(day) + '</div>'; lastDay = day; prevSender = null; }
      if (m.is_system) { html += '<div class="msg-sys">' + esc(m.text || '') + '</div>'; prevSender = null; return; }
      var mine = m.sender_id && MSG.me && String(m.sender_id) === String(MSG.me);
      var ai = m.is_ai;
      var showHead = isGroup && !mine;
      var same = prevSender === m.sender_id;
      var media = m.media_url ? mediaHtml(m) : '';
      var txt = m.text ? esc(m.text) : '';
      var bub = '<div class="bubble ' + (mine ? 'me' : (ai ? 'ai' : 'them')) + '">' +
        (showHead && !same ? '<div class="sender">' + esc(ai ? 'Dale' : (m.sender_name || 'Member')) + '</div>' : '') +
        media + (txt ? '<span>' + txt + '</span>' : '') +
        '<div class="bfoot">' + esc(timeHM(m.created_at)) + (mine ? tickSvg(m.status) : '') + '</div></div>';
      if (mine) { html += '<div class="msg-row me">' + bub + '</div>'; }
      else {
        var av = showHead ? (same ? '<div class="av mav blank"></div>' : avatar(m.sender_avatar, m.sender_name, 'mav')) : '';
        html += '<div class="msg-row them">' + av + bub + '</div>';
      }
      prevSender = m.sender_id;
    });
    return html;
  }

  function stopPoll() { if (MSG.poll) { clearInterval(MSG.poll); MSG.poll = null; } }
  function abortRecording() { if (REC.rec) { REC.saved = 'cancel'; try { REC.rec.stop(); } catch (e) { teardownRec(); } } }
  function closeConversation() {
    stopPoll(); abortRecording();
    MSG.active = null; MSG.activeRoom = null;
    var split = document.getElementById('msgSplit'); if (split) split.classList.remove('show-detail');
    document.querySelectorAll('.chat-row').forEach(function (el) { el.classList.remove('active'); });
    var detail = document.getElementById('msgDetail');
    if (detail) detail.innerHTML = '<div class="conv-empty"><div><svg viewBox="0 0 24 24"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/></svg><div>Select a conversation to start chatting</div></div></div>';
  }

  // ── Dale AI in the chat room ─────────────────────────────────
  function paintDale() {
    var b = document.getElementById('convDale'); if (!b) return;
    b.classList.toggle('on', !!MSG.aiEnabled);
    b.classList.toggle('busy', !!MSG.aiBusy);
    b.title = MSG.aiBusy ? 'Dale is thinking…' : (MSG.aiEnabled ? 'Dale is in this chat — tap to ask' : 'Add Dale to this chat');
    var sub = document.getElementById('convSub');
    if (sub && MSG.aiEnabled && MSG.activeRoom && MSG.activeRoom.room_type !== 'group') sub.textContent = '✨ Dale is in this chat';
  }
  function handleDaleTap(roomId) {
    if (MSG.aiBusy) return;
    if (!MSG.aiEnabled) enableDale(roomId); else openAskDale(roomId);
  }
  function enableDale(roomId) {
    MSG.aiBusy = true; paintDale();
    fetch(API + '/chat/rooms/' + roomId + '/ai/enable/', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok(), 'Accept': 'application/json' } })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        MSG.aiBusy = false;
        if (!res.ok) { window.snack((res.d && (res.d.detail || res.d.error)) || 'Couldn’t add Dale.', 'error'); paintDale(); return; }
        MSG.aiEnabled = res.d && res.d.ai_enabled != null ? !!res.d.ai_enabled : true;
        if (MSG.activeRoom) MSG.activeRoom.ai_enabled = MSG.aiEnabled;
        paintDale(); window.snack('Dale joined the chat ✨', 'ok'); loadMessages(roomId, true);

  // ── Voice recording ──────────────────────────────────────────
  var REC = { rec: null, stream: null, chunks: [], timer: null, secs: 0, saved: '', mime: 'audio/webm', ext: 'webm' };
  function pickAudioMime() {
    var MR = window.MediaRecorder;
    if (MR && MR.isTypeSupported) {
      if (MR.isTypeSupported('audio/webm;codecs=opus')) return { m: 'audio/webm;codecs=opus', up: 'audio/webm', ext: 'webm' };
      if (MR.isTypeSupported('audio/webm')) return { m: 'audio/webm', up: 'audio/webm', ext: 'webm' };
      if (MR.isTypeSupported('audio/ogg;codecs=opus')) return { m: 'audio/ogg;codecs=opus', up: 'audio/ogg', ext: 'ogg' };
      if (MR.isTypeSupported('audio/mp4')) return { m: 'audio/mp4', up: 'audio/mp4', ext: 'm4a' };
    }
    return { m: '', up: 'audio/webm', ext: 'webm' };
  }
  function fmtSecs(s) { var m = Math.floor(s / 60), r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r; }
  function teardownRec() {
    if (REC.timer) { clearInterval(REC.timer); REC.timer = null; }
    if (REC.stream) { REC.stream.getTracks().forEach(function (t) { t.stop(); }); REC.stream = null; }
    REC.rec = null; REC.chunks = [];
  }
  function restoreInputRow() {
    var mic = document.getElementById('convMic'), text = document.getElementById('convText'), att = document.getElementById('convAttach'), send = document.getElementById('convSend');
    var bar = document.getElementById('recBar'), cancel = document.getElementById('recCancel');
    if (bar) bar.remove(); if (cancel) cancel.remove();
    if (att) att.style.display = ''; if (text) text.style.display = ''; if (mic) mic.style.display = '';
    if (send) send.title = '';
  }
  function startRecording(roomId) {
    if (REC.rec) return;
    if (!navigator.mediaDevices || !window.MediaRecorder) { window.snack('Voice recording isn’t supported on this browser.', 'error'); return; }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      var pick = pickAudioMime(); REC.mime = pick.up; REC.ext = pick.ext;
      var rec = pick.m ? new MediaRecorder(stream, { mimeType: pick.m }) : new MediaRecorder(stream);
      REC.rec = rec; REC.stream = stream; REC.chunks = []; REC.secs = 0;
      rec.ondataavailable = function (e) { if (e.data && e.data.size) REC.chunks.push(e.data); };
      rec.onstop = function () {
        var blob = new Blob(REC.chunks, { type: REC.mime });
        teardownRec(); restoreInputRow();
        if (REC.saved === 'cancel' || !blob.size) return;
        var file = new File([blob], 'voice_message.' + REC.ext, { type: REC.mime });
        sendMedia(roomId, file);
      };
      rec.start();
      // Swap the input row into recording mode.
      var mic = document.getElementById('convMic'), text = document.getElementById('convText'), att = document.getElementById('convAttach'), send = document.getElementById('convSend');
      if (att) att.style.display = 'none'; if (text) text.style.display = 'none'; if (mic) mic.style.display = 'none';
      var bar = document.createElement('div'); bar.className = 'rec-bar'; bar.id = 'recBar';
      bar.innerHTML = '<span class="dot"></span><span class="rt" id="recTime">0:00</span><span class="lbl">Recording…</span>';
      var cancel = document.createElement('button'); cancel.className = 'rec-cancel'; cancel.id = 'recCancel'; cancel.title = 'Cancel';
      cancel.innerHTML = '<svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>';
      var input = document.getElementById('convInput');
      input.insertBefore(cancel, send); input.insertBefore(bar, cancel);
      if (send) send.title = 'Send voice message';
      cancel.addEventListener('click', function () { REC.saved = 'cancel'; try { rec.stop(); } catch (e) { teardownRec(); restoreInputRow(); } });
      REC.saved = '';

        REC.secs++; var t = document.getElementById('recTime'); if (t) t.textContent = fmtSecs(REC.secs);

  }

            rr.innerHTML = users.map(userSearchRow).join('');
            wireUserRows(rr);
          }).catch(function () { var rr = document.getElementById('usResults'); if (rr) rr.innerHTML = empty('Couldn’t search.'); });
        }, 280);
      });
    }
    function loadReqs() {
      var el = document.getElementById('reqBody'); el.innerHTML = '<div class="loading"><div class="spin"></div></div>';
      authFetch(mode === 'in' ? '/chat/requests/' : '/chat/requests/sent/').then(function (r) {
        if (!r.ok) { el.innerHTML = empty((r.d && r.d.detail) || 'Couldn’t load.'); return; }
        var reqs = listOf(r.d);
        if (!reqs.length) { el.innerHTML = empty(mode === 'in' ? 'No incoming requests.' : 'No sent requests.'); return; }
        el.innerHTML = reqs.map(function (rq) { return reqRow(rq, mode === 'in' ? 'in' : 'out'); }).join('');
        el.querySelectorAll('[data-acc]').forEach(function (b) { b.addEventListener('click', function () { reqAction('/chat/requests/' + b.getAttribute('data-acc') + '/accept/', 'Request accepted', function () { mode = 'in'; loadReqs(); }); }); });
        el.querySelectorAll('[data-dec]').forEach(function (b) { b.addEventListener('click', function () { reqAction('/chat/requests/' + b.getAttribute('data-dec') + '/decline/', 'Request declined', function () { mode = 'in'; loadReqs(); }); }); });
        el.querySelectorAll('[data-cancel]').forEach(function (b) { b.addEventListener('click', function () { reqAction('/chat/requests/' + b.getAttribute('data-cancel') + '/cancel/', 'Request cancelled', function () { mode = 'out'; loadReqs(); }); }); });
      }).catch(function () { el.innerHTML = empty('Couldn’t load.'); });
    }
    function render() { if (mode === 'find') renderFind(); else loadReqs(); }
    document.getElementById('reqTabs').addEventListener('click', function (e) { var b = e.target.closest('[data-rq]'); if (!b) return; mode = b.getAttribute('data-rq'); this.querySelectorAll('.feed-tab').forEach(function (x) { x.classList.toggle('active', x.getAttribute('data-rq') === mode); }); render(); });
    render();
  }
  function openBubbles() {
    openModal('<div class="modal-head"><div class="mi" style="background:linear-gradient(135deg,var(--g2),var(--g1))"><svg viewBox="0 0 24 24"><path d="M17 12V3a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v14l4-4h10a1 1 0 0 0 1-1zm4-6h-2v9H6v2a1 1 0 0 0 1 1h11l4 4V7a1 1 0 0 0-1-1z"/></svg></div><h2>Chat bubbles</h2><button class="ghost x" id="mClose" style="padding:8px 10px"><svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button></div>' +
      '<div class="feed-tabs" id="bubTabs" style="margin:6px 0 14px"><button class="feed-tab active" data-bt="create">Create</button><button class="feed-tab" data-bt="invites">Invites</button><button class="feed-tab" data-bt="discover">Discover</button></div>' +
      '<div id="bubBody"></div>');
    document.getElementById('mClose').addEventListener('click', closeModal);
    var mode = 'create';
    function render() {
      var el = document.getElementById('bubBody');
      if (mode === 'create') {
        el.innerHTML = '<label>Bubble name</label><input id="bbName" placeholder="e.g. Physics Squad" maxlength="60" />' +
          '<label>Description</label><textarea id="bbDesc" rows="3" placeholder="What’s this bubble about?"></textarea>' +
          '<button class="btn" id="bbCreate" style="margin-top:16px"><span class="spinner" style="width:18px;height:18px;border:2.5px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;display:none"></span><span>Create bubble</span></button>';
        document.getElementById('bbCreate').addEventListener('click', function () {
          var name = document.getElementById('bbName').value.trim(); if (!name) { window.snack('Name your bubble.', 'error'); return; }
          var btn = this; btn.disabled = true; btn.querySelector('.spinner').style.display = 'inline-block'; btn.querySelector('span:last-child').textContent = 'Creating…';
          fetch(API + '/chat/rooms/', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok(), 'Accept': 'application/json' }, body: JSON.stringify({ name: name, description: document.getElementById('bbDesc').value.trim(), is_public: true }) })
            .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
            .then(function (res) {
              if (!res.ok) { window.snack((res.d && (res.d.detail || res.d.error)) || 'Couldn’t create.', 'error'); btn.disabled = false; btn.querySelector('.spinner').style.display = 'none'; btn.querySelector('span:last-child').textContent = 'Create bubble'; return; }
              closeModal(); window.snack('Bubble created!', 'ok');
              var room = res.d; if (room && room.id) { if (!MSG.rooms.some(function (m) { return m.id === room.id; })) MSG.rooms.unshift(room); MSG.tab = 'bubbles'; var tabs = document.getElementById('msgTabs'); if (tabs) tabs.querySelectorAll('.feed-tab').forEach(function (x) { x.classList.toggle('active', x.getAttribute('data-mt') === 'bubbles'); }); drawRows(); openConversation(room.id); }
            }).catch(function () { window.snack('Couldn’t reach the server.', 'error'); btn.disabled = false; btn.querySelector('.spinner').style.display = 'none'; btn.querySelector('span:last-child').textContent = 'Create bubble'; });
        });
      } else if (mode === 'invites') {
        el.innerHTML = '<div class="loading"><div class="spin"></div></div>';
        authFetch('/chat/invites/').then(function (r) {
          if (!r.ok) { el.innerHTML = empty((r.d && r.d.detail) || 'Couldn’t load.'); return; }
          var inv = listOf(r.d);
          el.innerHTML = inv.length ? inv.map(function (iv) {
            return '<div class="card glass" style="margin-bottom:10px;display:flex;align-items:center;gap:12px">' + avatar(iv.avatar_url || iv.inviter_avatar, iv.name || iv.room_name || 'Bubble') +
              '<div style="flex:1;min-width:0"><b style="font-family:Arch;font-size:14px">' + esc(iv.name || iv.room_name || 'Bubble') + '</b><div class="faint" style="font-family:Momo;font-size:11.5px;margin-top:3px">Invited by ' + esc(iv.inviter_name || 'someone') + '</div></div>' +
              '<div style="display:flex;gap:6px"><button class="pillbtn" data-ia="' + esc(iv.id) + '">Join</button><button class="pillbtn ghost2" data-id="' + esc(iv.id) + '">Decline</button></div></div>';
          }).join('') : empty('No bubble invites.');
          el.querySelectorAll('[data-ia]').forEach(function (b) { b.addEventListener('click', function () { reqAction('/chat/invites/' + b.getAttribute('data-ia') + '/accept/', 'Joined the bubble', render); }); });
          el.querySelectorAll('[data-id]').forEach(function (b) { b.addEventListener('click', function () { reqAction('/chat/invites/' + b.getAttribute('data-id') + '/decline/', 'Invite declined', render); }); });
        }).catch(function () { el.innerHTML = empty('Couldn’t load.'); });
      } else {
        el.innerHTML = '<div class="loading"><div class="spin"></div></div>';
        authFetch('/chat/bubbles/discover/').then(function (r) {
          if (!r.ok) { el.innerHTML = empty((r.d && r.d.detail) || 'Couldn’t load.'); return; }
          var bs = listOf(r.d);
          el.innerHTML = bs.length ? bs.map(function (bb) {
            return '<div class="card glass" style="margin-bottom:10px;display:flex;align-items:center;gap:12px">' + avatar(bb.avatar_url, bb.name) +
              '<div style="flex:1;min-width:0"><b style="font-family:Arch;font-size:14px">' + esc(bb.name || 'Bubble') + '</b><div class="faint" style="font-family:Momo;font-size:11.5px;margin-top:3px">' + num(bb.members_count || bb.member_count) + ' members</div></div>' +
              '<button class="pillbtn" data-join="' + esc(bb.id) + '">Join</button></div>';
          }).join('') : empty('No bubbles to discover.');
          el.querySelectorAll('[data-join]').forEach(function (b) { b.addEventListener('click', function () { reqAction('/chat/bubbles/' + b.getAttribute('data-join') + '/join/', 'Joined!', render); }); });
        }).catch(function () { el.innerHTML = empty('Couldn’t load.'); });
      }
    }
    document.getElementById('bubTabs').addEventListener('click', function (e) { var b = e.target.closest('[data-bt]'); if (!b) return; mode = b.getAttribute('data-bt'); this.querySelectorAll('.feed-tab').forEach(function (x) { x.classList.toggle('active', x.getAttribute('data-bt') === mode); }); render(); });
    render();
  }
  function renderClubs() {
    renderListTab({ eyebrow: 'COMMUNITY', title: 'Clubs', noun: 'clubs', searchPh: 'Search clubs', path: '/clubs/?page=1', grid: true, cardFn: clubCard, wireFn: wireClubActions });
  }

  // ── PROFILE ──────────────────────────────────────────────────
  function renderProfile() {
    loading();
    authFetch('/users/me/').then(function (r) {
      if (!r.ok) { view.innerHTML = head('Profile', '') + empty((r.d && r.d.detail) || 'Couldn’t load your profile.'); return; }
      var u = r.d || {};
      var name = u.name || u.preferred_name || u.display_name || 'You';
      var role = (u.role || '').replace(/_/g, ' ');
      var interests = Array.isArray(u.interests) ? u.interests : [];
      var html = '<div class="feed-label"><div><div class="eyebrow">YOU</div><div class="feed-title">Profile</div></div>' +
        '<button class="icon-btn refresh-btn" id="pfRefresh" title="Refresh" style="width:44px;height:44px">' + REFRESH_SVG + '</button></div>';
      html += '<div class="card glass prof-hero">' + avatar(u.avatar_url, name, 'big round') +
        '<div><div style="font-family:Alfa;font-size:22px">' + esc(name) + '</div>' +
        '<div class="faint" style="font-family:Momo;font-size:12.5px;margin-top:4px">@' + esc(u.user_id || u.email || 'me') + '</div>' +
        (role ? '<span class="chip" style="background:rgba(142,84,233,.18);color:#C6B3F5;margin-top:10px;text-transform:capitalize">' + esc(role) + '</span>' : '') + '</div></div>';
      html += '<div class="card glass prof-stats" style="display:grid">' +
        '<div class="s"><div class="n">' + num(u.level != null ? u.level : 1) + '</div><div class="l">Level</div></div>' +
        '<div class="s"><div class="n">' + num(u.tokens) + '</div><div class="l">Tokens</div></div>' +
        '<div class="s"><div class="n">' + num(u.followers_count) + '</div><div class="l">Followers</div></div>' +
        '<div class="s"><div class="n">' + num(u.following_count) + '</div><div class="l">Following</div></div></div>';
      if (u.bio) html += '<div class="card glass"><b style="font-family:Arch;font-size:13px">About</b><div class="muted" style="font-family:Momo;font-size:13.5px;line-height:1.6;margin-top:8px">' + esc(u.bio) + '</div></div>';
      if (interests.length) html += '<div class="card glass"><b style="font-family:Arch;font-size:13px">Interests</b><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">' +
        interests.map(function (i) { return '<span class="chip" style="background:var(--glass-2);color:var(--sub);border:1px solid var(--hair)">' + esc(i) + '</span>'; }).join('') + '</div></div>';
      view.innerHTML = html;
      var rf = document.getElementById('pfRefresh'); if (rf) rf.addEventListener('click', function () { this.classList.add('spinning'); renderProfile(); });
    }).catch(function () { view.innerHTML = head('Profile', '') + empty('Couldn’t load your profile.'); window.snack('Couldn’t load profile', 'error'); });
  }

  var TABS = { home: renderHome, studyhub: renderStudyhub, messages: renderMessages, clubs: renderClubs, profile: renderProfile };
  function setTab(name) {
    if (!TABS[name]) name = 'home';
    document.querySelectorAll('.nav-item[data-tab]').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-tab') === name); });
    try { localStorage.setItem('tcs_tab', name); } catch (e) {}
    TABS[name]();
  }
  document.getElementById('nav').addEventListener('click', function (e) {
    var b = e.target.closest('.nav-item[data-tab]'); if (b) setTab(b.getAttribute('data-tab'));
  });
  document.getElementById('arcadeBtn').addEventListener('click', function () { window.snack('Arcade lives in the mobile app for now', 'info'); });
  document.getElementById('logout').addEventListener('click', function () {
    var r = tok();
    if (r) { fetch(API + '/accounts/logout/', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + r }, body: JSON.stringify({ refresh: localStorage.getItem('tcs_refresh') || '' }) }).catch(function () {}); }
    clearSession(); window.snack('Signed out', 'ok', 1000);
    setTimeout(function () { location.href = 'auth.html'; }, 600);
  });

  // Notifications
  var notifPanel = document.getElementById('notifPanel');
  document.getElementById('notifBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    var open = notifPanel.classList.toggle('open');
    if (open) loadNotifs();
  });
  document.addEventListener('click', function (e) { if (!notifPanel.contains(e.target)) notifPanel.classList.remove('open'); });
  function loadNotifs() {
    var list = document.getElementById('notifList');
    list.innerHTML = '<div class="loading" style="padding:20px"><div class="spin"></div></div>';
    authFetch('/notifications/?page=1').then(function (r) {
      if (!r.ok) { list.innerHTML = '<div class="empty" style="padding:24px">' + esc((r.d && r.d.detail) || 'Couldn’t load notifications.') + '</div>'; return; }
      var n = listOf(r.d);
      if (!n.length) { list.innerHTML = '<div class="empty" style="padding:24px">You’re all caught up.</div>'; return; }
      list.innerHTML = n.slice(0, 15).map(function (x) {
        return '<div class="notif-item"><div class="t">' + esc(x.title || x.verb || 'Notification') + '</div>' +
          '<div class="b">' + esc(x.body || x.message || x.text || '') + '</div></div>';
      }).join('');
    }).catch(function () { list.innerHTML = '<div class="empty" style="padding:24px">Couldn’t load notifications.</div>'; });
  }
  function loadNotifCount() {
    authFetch('/notifications/unread-count/').then(function (r) {
      if (!r.ok) return;
      var c = (r.d && (r.d.count != null ? r.d.count : r.d.unread)) || 0;
      var dot = document.getElementById('notifDot');
      if (c > 0) { dot.textContent = c > 99 ? '99+' : c; dot.classList.add('show'); } else { dot.classList.remove('show'); }
    }).catch(function () {});
  }

  // Boot
  var start = 'home'; try { start = localStorage.getItem('tcs_tab') || 'home'; } catch (e) {}
  setTab(start);
  loadNotifCount();
</script>
</body>
</html>
