<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Create account · TCS</title>
<meta name="theme-color" content="#0D0D1A" />
<link rel="stylesheet" href="assets/onboarding.css" />
<style>
  .wrap {
    width: 100%; max-width: 440px; margin: 0 auto; min-height: 100dvh;
    display: flex; flex-direction: column;
    padding: max(env(safe-area-inset-top), 22px) 22px max(env(safe-area-inset-bottom), 26px);
  }
  .topbar { display: flex; }
  .back { padding: 10px 14px; }

  .hero { display: flex; flex-direction: column; align-items: center; text-align: center; margin-top: 12px; }
  .role-icon { width: 80px; height: 80px; border-radius: 26px; animation: bob 3s ease-in-out infinite;
               background: linear-gradient(135deg, #F7971E, #FF5858); box-shadow: 0 16px 34px rgba(247,151,30,0.32); }
  .role-icon svg { width: 42px; height: 42px; }
  @keyframes bob { 0%,100% { transform: translateY(-6px); } 50% { transform: translateY(6px); } }
  .eyebrow { margin-top: 18px; font-family: 'Arch', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--faint); }
  .title { font-family: 'Alfa', serif; font-size: clamp(27px, 8vw, 32px); margin-top: 8px; line-height: 1.1; }
  .lede { font-family: 'Momo', sans-serif; font-size: 13.5px; color: var(--sub); margin-top: 10px; line-height: 1.5; max-width: 30ch; }

  form { margin-top: 24px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  #fields { display: flex; flex-direction: column; gap: 16px; }

  .seg { display: flex; gap: 6px; background: rgba(0,0,0,0.25); padding: 5px; border-radius: 14px; border: 1px solid var(--hair); }
  .seg button { flex: 1; height: 40px; border: 0; cursor: pointer; border-radius: 10px; background: none;
    font-family: 'Arch', sans-serif; font-weight: 700; font-size: 12.5px; color: var(--sub); transition: background 0.15s ease, color 0.15s ease; }
  .seg button[aria-pressed="true"] { background: linear-gradient(90deg, var(--g2), var(--g1)); color: #fff; }

  .field label { display: block; font-family: 'Arch', sans-serif; font-weight: 700; font-size: 12px; color: var(--ink); margin-bottom: 8px; letter-spacing: 0.3px; }
  .input { display: flex; align-items: center; height: 54px; border-radius: 15px; background: rgba(255,255,255,0.05);
           border: 1.5px solid var(--hair); overflow: hidden; transition: border-color 0.15s ease, background 0.15s ease; }
  .input:focus-within { border-color: var(--g2); background: rgba(255,255,255,0.09); }
  .input .ic { width: 50px; height: 100%; flex: 0 0 auto; display: grid; place-items: center; border-right: 1px solid var(--hair); }
  .input .ic svg { width: 21px; height: 21px; fill: var(--faint); }
  .input:focus-within .ic svg { fill: var(--sub); }
  .input input { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: none;
                 padding: 0 15px; font-family: 'Momo', sans-serif; font-size: 15px; color: var(--ink); }
  .input input::placeholder { color: var(--faint); }

  .msg { min-height: 18px; font-family: 'Momo', sans-serif; font-size: 12.5px; }
  .msg.error { color: var(--err); } .msg.ok { color: var(--ok); }
  .spinner { width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,0.45); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
  .btn.loading .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .alt { text-align: center; font-family: 'Momo', sans-serif; font-size: 13px; color: var(--sub); margin-top: 18px; }
  .alt a { color: var(--g1); font-weight: 700; text-decoration: none; }
  .alt a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="backdrop"></div>
  <div class="blob p"></div><div class="blob o"></div><div class="blob c"></div>
  <canvas id="particles"></canvas>

  <main class="wrap layer">
    <div class="topbar">
      <button class="ghost back" type="button" onclick="location.href='login.html?role=visitor'">
        <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg> Back
      </button>
    </div>

    <div class="hero">
      <div class="role-icon brand-mark">
        <svg viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      </div>
      <div class="eyebrow">Create account</div>
      <h1 class="title">Join <span class="grad-text">TCS</span></h1>
      <p class="lede">For guests, parents and the wider community.</p>
    </div>

    <form class="glass" id="form" novalidate>
      <div id="fields">
        <div class="field"><label>I am a…</label>
          <div class="seg" id="seg">
            <button type="button" data-r="visitor" aria-pressed="true">Visitor</button>
            <button type="button" data-r="parent" aria-pressed="false">Parent</button>
          </div>
        </div>
        <div class="field"><label for="name">Full name</label>
          <div class="input"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></span>
            <input id="name" type="text" placeholder="Your name" autocomplete="name" /></div>
        </div>
        <div class="field"><label for="email">Email</label>
          <div class="input"><span class="ic"><svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg></span>
            <input id="email" type="email" inputmode="email" placeholder="you@example.com" autocomplete="off" /></div>
        </div>
        <div class="field"><label for="username">Username</label>
          <div class="input"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" opacity=".0"/><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zm0 12.2a7.2 7.2 0 0 1-5-2c.03-1.6 3.3-2.5 5-2.5s4.97.9 5 2.5a7.2 7.2 0 0 1-5 2z"/></svg></span>
            <input id="username" type="text" placeholder="Pick a username" autocomplete="off" /></div>
        </div>
        <div class="field"><label for="password">Password</label>
          <div class="input"><span class="ic"><svg viewBox="0 0 24 24"><path d="M18 8h-1V6A5 5 0 0 0 7 6v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM9 6a3 3 0 0 1 6 0v2H9V6zm3 11a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg></span>
            <input id="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" /></div>
        </div>
        <div class="field"><label for="confirm">Confirm password</label>
          <div class="input"><span class="ic"><svg viewBox="0 0 24 24"><path d="M18 8h-1V6A5 5 0 0 0 7 6v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM9 6a3 3 0 0 1 6 0v2H9V6zm3 11a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg></span>
            <input id="confirm" type="password" placeholder="Re-enter password" autocomplete="new-password" /></div>
        </div>
      </div>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
      <button class="btn" id="submit" type="submit">
        <span class="spinner" aria-hidden="true"></span>
        <span id="submitLabel">Create account</span>
      </button>
    </form>

    <p class="alt">Already have an account? <a href="login.html?role=visitor">Sign in</a></p>
  </main>

<script src="assets/particles.js"></script>
<script>
  var API = 'https://tcs-nsw.duckdns.org/api';
  var role = 'visitor';

  document.getElementById('seg').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-r]'); if (!b) return;
    role = b.getAttribute('data-r');
    this.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
  });

  var submitEl = document.getElementById('submit');
  var msgEl = document.getElementById('msg');
  function setMsg(t, k) { msgEl.textContent = t || ''; msgEl.className = 'msg' + (k ? ' ' + k : ''); }
  function loading(on) {
    submitEl.disabled = on; submitEl.classList.toggle('loading', on);
    document.getElementById('submitLabel').textContent = on ? 'Creating…' : 'Create account';
  }
  function val(id) { return document.getElementById(id).value.trim(); }

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault(); setMsg('');
    var name = val('name'), email = val('email'), username = val('username');
    var pw = document.getElementById('password').value, cpw = document.getElementById('confirm').value;
    if (!name || !email || !username) { setMsg('Please fill in your name, email and username.', 'error'); return; }
    if (pw.length < 8) { setMsg('Password must be at least 8 characters.', 'error'); return; }
    if (pw !== cpw) { setMsg('Passwords don’t match.', 'error'); return; }

    loading(true);
    fetch(API + '/accounts/register/', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ name: name, username: username, email: email, password: pw, confirm_password: pw, role: role }),
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok) {
          var d = res.d || {};
          var msg = d.detail || d.error || (d.email && ('Email: ' + d.email)) ||
                    (d.username && ('Username: ' + d.username)) || 'Could not create your account. Please check your details.';
          setMsg(String(msg), 'error'); loading(false); return;
        }
        // Registered — now sign in to get tokens.
        return fetch(API + '/accounts/login-password/', {
          method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ identifier: email, password: pw }),
        }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (lr) {
            if (lr && lr.ok && lr.d) {
              try {
                if (lr.d.access) localStorage.setItem('tcs_access', lr.d.access);
                if (lr.d.refresh) localStorage.setItem('tcs_refresh', lr.d.refresh);
                if (lr.d.user) localStorage.setItem('tcs_user', JSON.stringify(lr.d.user));
              } catch (e) {}
            }
            setMsg('Account created — welcome to TCS!', 'ok');
            loading(false);
          });
      })
      .catch(function () { setMsg('Couldn’t reach the server. Check your connection and try again.', 'error'); loading(false); });
  });
</script>
</body>
</html>
