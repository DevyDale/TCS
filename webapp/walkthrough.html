<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Welcome to TCS</title>
<meta name="theme-color" content="#0D0D1A" />
<link rel="stylesheet" href="assets/onboarding.css" />
<style>
  body { overflow: hidden; }
  .screen {
    position: relative; z-index: 3; height: 100dvh; display: flex; flex-direction: column;
    padding: max(env(safe-area-inset-top), 14px) 0 max(env(safe-area-inset-bottom), 22px);
    max-width: 560px; margin: 0 auto;
  }
  .topbar { display: flex; justify-content: flex-end; padding: 0 20px; height: 44px; align-items: center; }
  .skip { padding: 9px 14px; font-size: 13px; color: var(--sub); }
  .skip.hidden { opacity: 0; pointer-events: none; }

  .viewport { flex: 1; overflow: hidden; }
  .track { display: flex; height: 100%; touch-action: pan-y; transition: transform 0.42s cubic-bezier(0.22,0.61,0.36,1); }
  .slide { min-width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px 32px; text-align: center; }

  .art { position: relative; width: 240px; height: 240px; display: grid; place-items: center; }
  .ring { position: absolute; width: 224px; height: 224px; border-radius: 50%; animation: spin 9s linear infinite;
          -webkit-mask: radial-gradient(circle, transparent 57%, #000 58%); mask: radial-gradient(circle, transparent 57%, #000 58%); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .disc { position: absolute; width: 186px; height: 186px; border-radius: 50%; }
  .emoji { position: relative; font-size: 92px; line-height: 1; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.4)); animation: floaty 2.8s ease-in-out infinite; }
  @keyframes floaty { 0%,100% { transform: translateY(-9px); } 50% { transform: translateY(9px); } }

  .title { font-family: 'Alfa', serif; font-size: clamp(26px, 7.5vw, 31px); color: var(--ink); line-height: 1.15; margin-top: 46px; text-wrap: balance; }
  .body { font-family: 'Momo', sans-serif; font-size: 14px; line-height: 1.65; color: var(--sub); margin-top: 16px; max-width: 33ch; }

  .dots { display: flex; justify-content: center; gap: 8px; margin: 6px 0 24px; }
  .dot { width: 8px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.22); transition: width 0.3s cubic-bezier(0.22,0.61,0.36,1), background 0.3s; }
  .dot.active { width: 32px; background: linear-gradient(90deg, var(--g2), var(--g1)); }

  .cta-wrap { padding: 0 32px; }
  @media (prefers-reduced-motion: reduce) { .ring, .emoji { animation: none; } .track { transition: none; } }
</style>
</head>
<body>
  <div class="backdrop"></div>
  <div class="blob p"></div><div class="blob o"></div><div class="blob c"></div>
  <canvas id="particles"></canvas>

  <div class="screen">
    <div class="topbar"><button class="ghost skip" id="skip" type="button">Skip</button></div>
    <div class="viewport"><div class="track" id="track"></div></div>
    <div class="dots" id="dots"></div>
    <div class="cta-wrap">
      <button class="btn" id="cta" type="button">
        <span id="ctaLabel">Next</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>
  </div>

<script src="assets/particles.js"></script>
<script>
  var AUTH_URL = 'auth.html', DONE_KEY = 'tcs_walkthrough_done';
  var SLIDES = [
    { emoji: '🎓', title: 'Welcome to TCS', body: 'Your campus life, all in one place. Connect, share, and discover what’s happening at Taylors.', grad: ['#8E54E9', '#6DD5FA'] },
    { emoji: '📸', title: 'Share & Connect', body: 'Post moments, browse your feed, message friends, and build your campus story.', grad: ['#F7971E', '#FF5858'] },
    { emoji: '🎉', title: 'Clubs & Events', body: 'Find your tribe in clubs, never miss an event, and play arcade games with friends.', grad: ['#11998E', '#38EF7D'] },
    { emoji: '🚀', title: 'Ready to Begin?', body: 'Choose your role and let’s get you set up in seconds.', grad: ['#8E54E9', '#EC4899'] },
  ];
  function hexA(hex, a) { var n = parseInt(hex.slice(1), 16); return 'rgba(' + ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')'; }

  var track = document.getElementById('track'), dotsEl = document.getElementById('dots');
  var skipEl = document.getElementById('skip'), ctaEl = document.getElementById('cta'), ctaLabel = document.getElementById('ctaLabel');
  var index = 0;

  SLIDES.forEach(function (s, i) {
    var a = s.grad[0], b = s.grad[1];
    var slide = document.createElement('section');
    slide.className = 'slide';
    slide.innerHTML =
      '<div class="art">' +
        '<div class="ring" style="background:conic-gradient(from 0deg,' + hexA(a,0.18) + ',' + hexA(b,0.6) + ',' + hexA(a,0.18) + ')"></div>' +
        '<div class="disc" style="background:linear-gradient(135deg,' + a + ',' + b + ');box-shadow:0 18px 42px ' + hexA(a,0.5) + '"></div>' +
        '<div class="emoji">' + s.emoji + '</div>' +
      '</div>' +
      '<h2 class="title">' + s.title + '</h2>' +
      '<p class="body">' + s.body + '</p>';
    track.appendChild(slide);
    var dot = document.createElement('span'); dot.className = 'dot' + (i === 0 ? ' active' : ''); dotsEl.appendChild(dot);
  });
  var dots = dotsEl.querySelectorAll('.dot');

  function render() {
    track.style.transform = 'translateX(' + (-index * 100) + '%)';
    dots.forEach(function (d, i) { d.classList.toggle('active', i === index); });
    var last = index === SLIDES.length - 1;
    ctaLabel.textContent = last ? 'Get Started' : 'Next';
    skipEl.classList.toggle('hidden', last);
  }
  function goTo(i) { index = Math.max(0, Math.min(SLIDES.length - 1, i)); render(); }
  function finish() { try { localStorage.setItem(DONE_KEY, '1'); } catch (e) {} window.location.href = AUTH_URL; }

  ctaEl.addEventListener('click', function () { if (index === SLIDES.length - 1) finish(); else goTo(index + 1); });
  skipEl.addEventListener('click', finish);
  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') goTo(index + 1);
    else if (e.key === 'ArrowLeft') goTo(index - 1);
    else if (e.key === 'Escape') finish();
  });

  var startX = 0, dragging = false, vp = document.querySelector('.viewport');
  vp.addEventListener('pointerdown', function (e) { dragging = true; startX = e.clientX; });
  window.addEventListener('pointerup', function (e) {
    if (!dragging) return; dragging = false;
    var dx = e.clientX - startX;
    if (dx < -55) goTo(index + 1); else if (dx > 55) goTo(index - 1);
  });

  render();
</script>
</body>
</html>
